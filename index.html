<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="./icon.png.jpg">
<link rel="icon" type="image/jpeg" href="./icon.png.jpg">
<link rel="manifest" href="./manifest.json">
<title>메시지</title>

<style>
:root{
  --blue:#0a84ff;
  --bg:#fff;
  --dim:#f2f2f7;
  --text:#111;
  --sub:#8e8e93;
  --line:rgba(60,60,67,.29);
  --them:#e9e9eb;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  background:#000;color:var(--text)
}
button,input,textarea{font-family:inherit}

.app{
  width:100%;height:100dvh;max-width:430px;margin:auto;
  position:relative;overflow:hidden;background:var(--bg)
}
body.dark .app{background:#000;color:#f2f2f7}

.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:inherit;transition:.3s cubic-bezier(.32,.72,0,1);
}
.hidden{transform:translateX(100%)!important}
.left{transform:translateX(-25%)!important}

.nav{
  flex-shrink:0;padding:
    calc(env(safe-area-inset-top,0px) + 8px)
    16px 8px;
}
.navrow{
  height:45px;display:flex;align-items:center;
  justify-content:space-between
}
.nav button{
  border:0;background:none;color:var(--blue);
  font-size:17px;padding:6px 2px
}
.title{
  font-size:40px;font-weight:800;letter-spacing:-1.8px;
  margin-top:9px;margin-bottom:10px
}

/* 상단 메뉴 */
.top-actions{display:flex;align-items:center;gap:8px}
.circle-btn{
  width:44px;height:44px;border-radius:50%;border:0;
  background:var(--dim);color:var(--text);
  display:flex;align-items:center;justify-content:center;
  font-size:23px
}
body.dark .circle-btn{background:#1c1c1e;color:#fff}

.menu-popup{
  position:absolute;z-index:1000;
  top:calc(env(safe-area-inset-top,0px) + 60px);
  right:12px;width:250px;
  padding:7px 0;border-radius:15px;
  background:rgba(250,250,252,.97);
  box-shadow:0 8px 35px rgba(0,0,0,.25);
  backdrop-filter:blur(25px);
  display:none
}
body.dark .menu-popup{background:rgba(42,42,44,.98);color:#fff}
.menu-popup.open{display:block}
.menu-popup button{
  width:100%;border:0;background:none;
  color:inherit;text-align:left;
  padding:11px 17px;font-size:17px
}
.menu-popup button:active{background:rgba(128,128,128,.15)}
.menu-label{
  color:var(--sub);font-size:12px;padding:8px 17px 4px
}
.menu-line{height:.5px;background:var(--line);margin:4px 0}

/* 검색 */
.search{
  margin:0 16px 8px;height:38px;border-radius:10px;
  background:var(--dim);color:var(--sub);
  display:flex;align-items:center;gap:7px;
  padding:0 11px;font-size:16px
}
.search svg{width:16px;height:16px}

/* 프로필 */
.profile{
  margin:0 16px 7px;padding:12px 14px;
  border-radius:25px;background:var(--dim);
  display:flex;align-items:center;gap:12px
}
body.dark .profile{background:#171719}
.avatar{
  width:52px;height:52px;border-radius:50%;
  overflow:hidden;display:flex;align-items:center;
  justify-content:center;color:white;font-weight:700;
  flex-shrink:0
}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:18px;font-weight:700}
.profile-status{font-size:14px;color:var(--sub);margin-top:2px}
.chev{font-size:34px;color:var(--sub);font-weight:300}

/* 편집 */
.editbar{
  height:45px;display:none;
  align-items:center;justify-content:space-between;
  padding:0 16px;border-bottom:.5px solid var(--line)
}
.editbar.open{display:flex}
.editbar button{
  border:0;background:none;color:var(--blue);
  font-size:16px
}
.edit-count{font-size:14px;color:var(--sub)}

.list{
  flex:1;overflow-y:auto;padding-bottom:75px
}
.row{
  min-height:73px;padding:9px 16px 0 14px;
  display:flex;align-items:flex-start;gap:10px;
  position:relative
}
.row:active{background:var(--dim)}
.row.selected{background:rgba(10,132,255,.08)}
.row-main{
  flex:1;min-width:0;padding-bottom:11px;
  border-bottom:.5px solid var(--line)
}
.row:last-child .row-main{border-bottom:0}
.row-top{display:flex;justify-content:space-between;gap:8px}
.name{font-size:18px;font-weight:650}
.time{font-size:14px;color:var(--sub)}
.preview{
  color:var(--sub);font-size:15.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px
}
.unread{
  width:10px;height:10px;background:var(--blue);
  border-radius:50%;flex-shrink:0;margin-top:6px
}
.check{
  width:22px;height:22px;border-radius:50%;
  border:2px solid #aaa;flex-shrink:0;margin-top:15px;
  display:flex;align-items:center;justify-content:center
}
.check.on{background:var(--blue);border-color:var(--blue);color:#fff}
.check.on:after{content:"✓";font-size:13px;font-weight:700}

/* 하단 검색 */
.bottom-search{
  position:absolute;z-index:20;
  left:16px;right:82px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 9px);
  margin:0;height:48px;border-radius:24px;
  background:rgba(242,242,247,.94);
  backdrop-filter:blur(20px);
  display:flex;align-items:center;
  padding:0 15px;color:var(--sub);gap:7px
}
body.dark .bottom-search{background:rgba(28,28,30,.94)}
.compose{
  position:absolute;z-index:21;right:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 9px);
  width:56px;height:56px;border-radius:50%;
  border:0;background:var(--dim);font-size:27px;color:var(--text)
}
body.dark .compose{background:#171719;color:#fff}

/* 채팅 */
.chatnav{padding-bottom:2px}
.back{
  display:flex!important;align-items:center;gap:2px
}
.back svg{width:11px;height:19px}
.chatinfo{
  display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer
}
.chatinfo .avatar{width:54px;height:54px}
.chatname{font-size:12px;font-weight:600;color:var(--sub)}
.messages{
  flex:1;overflow-y:auto;padding:8px 12px 14px;
  display:flex;flex-direction:column
}
.date{
  text-align:center;color:var(--sub);
  font-size:12px;font-weight:600;margin:13px 0 8px
}
.msgrow{display:flex;margin:1.5px 0}
.msgrow.me{justify-content:flex-end}
.msgrow.them{justify-content:flex-start}
.bubble{
  max-width:75%;padding:8px 14px;
  border-radius:20px;font-size:16.5px;
  line-height:1.32;word-break:break-word;
  white-space:pre-wrap
}
.bubble.them{
  background:var(--them);color:var(--text);
  border-bottom-left-radius:5px
}
.bubble.me{
  color:#fff;border-bottom-right-radius:5px;
  background:var(--bubble-color,#0a84ff)
}
.read{
  text-align:right;color:var(--sub);
  font-size:12px;margin:2px 5px
}
.inputbar{
  flex-shrink:0;display:flex;align-items:flex-end;
  gap:8px;padding:8px 10px
}
.plus{
  width:30px;height:30px;border-radius:50%;
  border:1.5px solid var(--sub);background:none;
  color:var(--sub);font-size:20px
}
.inputwrap{
  flex:1;min-height:34px;border-radius:20px;
  background:var(--dim);border:.5px solid var(--line);
  display:flex
}
textarea.msginput{
  width:100%;resize:none;outline:0;border:0;
  background:none;padding:7px 11px;
  font-size:16.5px;color:inherit;max-height:100px
}
.send{
  width:30px;height:30px;border-radius:50%;
  border:0;background:var(--blue);color:#fff;
  opacity:.35
}
.send.ready{opacity:1}

/* 연락처 */
.contact-body{
  flex:1;overflow:auto;text-align:center;padding:8px 20px
}
.big-avatar{
  width:104px;height:104px;border-radius:50%;
  margin:5px auto 10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:38px;font-weight:700
}
.big-avatar img{width:100%;height:100%;object-fit:cover}
.contact-name{font-size:24px;font-weight:700}
.contact-phone{font-size:14px;color:var(--sub);margin-top:2px}
.contact-actions{
  display:flex;justify-content:center;gap:30px;margin:22px 0
}
.contact-action{color:var(--blue);font-size:12px}
.contact-action button{
  display:block;width:56px;height:56px;border:0;
  border-radius:50%;background:var(--dim);
  margin:auto auto 5px;color:var(--blue);font-size:22px
}
.info-card{
  text-align:left;background:var(--dim);
  border-radius:14px;overflow:hidden
}
.info-row{padding:10px 14px;border-bottom:.5px solid var(--line)}
.info-row:last-child{border:0}
.info-label{font-size:12px;color:var(--sub)}
.info-value{font-size:16px;color:var(--blue);margin-top:2px}

/* 관리자 */
.admin{
  background:var(--dim)
}
body.dark .admin{background:#000}
.admin-head{
  padding:calc(env(safe-area-inset-top,0px) + 15px) 16px 12px
}
.admin-head h1{margin:0;font-size:22px}
.badge{
  display:inline-block;margin-top:6px;
  padding:3px 8px;border-radius:8px;
  font-size:11px;font-weight:700;
  background:rgba(255,159,10,.14);color:#ff9f0a
}
.admin-body{flex:1;overflow:auto;padding:0 14px 30px}
.card{
  background:var(--bg);border-radius:15px;
  padding:14px;margin-bottom:14px
}
body.dark .card{background:#1c1c1e}
.card h2{margin:0 0 10px;font-size:13px;color:var(--sub)}
.char{
  display:flex;align-items:center;gap:10px;
  padding:8px 0;border-bottom:.5px solid var(--line)
}
.char:last-child{border-bottom:0}
.char.selected{background:rgba(10,132,255,.08);margin:0 -8px;padding:8px;border-radius:10px}
.char .avatar{width:38px;height:38px;font-size:14px}
.char-info{flex:1;min-width:0}
.char-name{font-size:15px;font-weight:600}
.char-phone{font-size:12px;color:var(--sub)}
.danger{
  border:0;background:none;color:#ff3b30;font-size:16px
}
.form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.form input,.form textarea{
  border:.5px solid var(--line);border-radius:9px;
  padding:9px;background:var(--dim);
  color:inherit;font-size:14px
}
.form input[type=text]{flex:1;min-width:100px}
.primary{
  border:0;border-radius:9px;
  background:var(--blue);color:#fff;
  padding:9px 14px;font-weight:600
}
.thread{max-height:280px;overflow:auto;background:var(--dim);border-radius:10px;padding:5px}
body.dark .thread{background:#0b0b0c}
.thread-msg{
  display:flex;gap:6px;padding:5px;font-size:13px;
  align-items:center
}
.thread-who{width:45px;font-size:11px;font-weight:700;color:var(--sub)}
.thread-msg.them .thread-who{color:#ff9f0a}
.thread-msg.me .thread-who{color:var(--blue)}
.thread-text{flex:1;word-break:break-word}
.thread-time{font-size:10px;color:var(--sub)}
.thread-del{border:0;background:none;color:var(--sub)}
.composer textarea{width:100%;min-height:65px;resize:none}
.color-setting{
  width:100%;display:flex;align-items:center;
  justify-content:space-between;
  margin-top:9px;font-size:14px
}
.color-setting input{width:52px;height:34px;padding:0;border:0;background:none}

/* 프로필 시트 */
.overlay{
  position:absolute;inset:0;z-index:200;
  background:rgba(0,0,0,.35);
  display:none;align-items:flex-end
}
.overlay.open{display:flex}
.sheet{
  width:100%;max-height:90%;overflow:auto;
  background:var(--bg);border-radius:27px 27px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 25px)
}
body.dark .sheet{background:#111113}
.grabber{width:44px;height:5px;background:#c7c7cc;border-radius:5px;margin:auto auto 15px}
.sheet h2{text-align:center;font-size:21px;margin:0 0 18px}
.preview{
  width:104px;height:104px;border-radius:50%;
  margin:auto auto 10px;overflow:hidden;
  background:#3d365a;color:white;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:700
}
.preview img{width:100%;height:100%;object-fit:cover}
.change{
  display:block;margin:auto;border:0;background:none;
  color:var(--blue);font-size:16px;font-weight:600
}
.field{
  background:var(--dim);border-radius:14px;
  padding:10px 13px;margin-top:10px
}
body.dark .field{background:#1c1c1e}
.field label{display:block;color:var(--sub);font-size:12px}
.field input{
  width:100%;border:0;outline:0;background:none;
  color:inherit;font-size:17px;margin-top:3px
}
.sheet-buttons{display:flex;gap:10px;margin-top:16px}
.sheet-buttons button{
  flex:1;border:0;border-radius:14px;
  padding:13px;font-size:16px;font-weight:700
}
.cancel{background:var(--dim);color:inherit}
.save{background:var(--blue);color:#fff}

/* 빈 화면 */
.empty{text-align:center;color:var(--sub);padding:60px 25px}
</style>
</head>

<body>
<div class="app">

<!-- ================= 사용자 목록 ================= -->
<section class="screen" id="listScreen">

  <div class="nav">
    <div class="navrow">
      <button id="editBtn">편집</button>

      <div class="top-actions">
        <button class="circle-btn" id="menuBtn">☰</button>
        <button class="circle-btn" id="composeBtn">✎</button>
      </div>
    </div>

    <div class="title">메시지</div>

    <div class="editbar" id="editBar">
      <button id="editCancel">취소</button>
      <span class="edit-count" id="editCount">0개 선택됨</span>
      <button id="editDelete">삭제</button>
    </div>
  </div>

  <div class="profile" id="profileCard">
    <div class="avatar" id="myAvatar"></div>
    <div class="profile-info">
      <div class="profile-name" id="myName">양예서</div>
      <div class="profile-status" id="myStatus">이름 및 사진 공유</div>
    </div>
    <div class="chev">›</div>
  </div>

  <div class="list" id="conversationList"></div>

  <div class="bottom-search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/>
      <path d="M20 20l-4-4"/>
    </svg>
    검색
  </div>

  <button class="compose" id="bottomCompose">✎</button>

  <!-- 아이폰식 오른쪽 메뉴 -->
  <div class="menu-popup" id="menuPopup">

    <button id="menuMessages">메시지</button>
    <button id="menuSpam">스팸</button>
    <button id="menuDeleted">최근 삭제된 항목</button>

    <div class="menu-line"></div>

    <div class="menu-label">필터 기준</div>

    <button id="menuUnread">
      읽지 않음
      <span id="unreadMark" style="float:right;color:#0a84ff">○</span>
    </button>

    <div class="menu-line"></div>

    <button id="filterManage">
      필터링 관리
      <span style="float:right;color:#8e8e93">⚙︎</span>
    </button>

  </div>
</section>


<!-- ================= 채팅 ================= -->
<section class="screen hidden" id="chatScreen">

  <div class="nav chatnav">
    <div class="navrow">
      <button class="nav back" id="chatBack">
        <svg viewBox="0 0 12 20" fill="none" stroke="currentColor"
             stroke-width="2.4">
          <path d="M10 2L2 10l8 8"/>
        </svg>
        <span>메시지</span>
      </button>

      <div></div>

      <button class="nav" id="chatInfo" style="font-size:22px">ⓘ</button>
    </div>

    <div class="chatinfo" id="chatHeader"></div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="inputbar">
    <button class="plus">+</button>

    <div class="inputwrap">
      <textarea class="msginput" id="messageInput"
                rows="1" placeholder="iMessage"></textarea>
    </div>

    <button class="send" id="sendBtn">
      ↑
    </button>
  </div>

</section>


<!-- ================= 연락처 ================= -->
<section class="screen hidden" id="contactScreen">

  <div class="nav">
    <div class="navrow">
      <button class="nav back" id="contactBack">
        <svg viewBox="0 0 12 20" fill="none" stroke="currentColor"
             stroke-width="2.4">
          <path d="M10 2L2 10l8 8"/>
        </svg>
        메시지
      </button>
      <div></div><div style="width:40px"></div>
    </div>
  </div>

  <div class="contact-body" id="contactBody"></div>

</section>


<!-- ================= 관리자 ================= -->
<section class="screen admin hidden" id="adminScreen">

  <div class="admin-head">
    <h1>메신저 관리자</h1>
    <div class="badge">데모 · 실제 전송 없음</div>
  </div>

  <div class="admin-body">

    <div class="card">
      <h2>캐릭터</h2>
      <div id="characterList"></div>

      <div class="form">
        <input type="text" id="newCharacter"
               placeholder="새 캐릭터 이름">
        <button class="primary" id="addCharacter">추가</button>
      </div>
    </div>

    <div class="card" id="characterSettings" style="display:none">

      <h2 id="settingsTitle">캐릭터 설정</h2>

      <div class="form">
        <input type="text" id="characterName"
               placeholder="이름">

        <input type="text" id="characterPhone"
               placeholder="전화번호">

        <input type="file" id="characterPhoto"
               accept="image/*">

        <div class="color-setting">
          <span>사용자 말풍선 색상</span>
          <input type="color" id="bubbleColor">
        </div>

        <button class="primary" id="saveCharacter">
          저장
        </button>
      </div>

      <h2 style="margin-top:18px">대화</h2>

      <div class="thread" id="thread"></div>

      <div class="composer" style="margin-top:10px">
        <textarea id="adminMessage"
                  placeholder="캐릭터로서 보낼 메시지"></textarea>

        <button class="primary" id="adminSend"
                style="width:100%">
          메시지 전송
        </button>
      </div>

    </div>

  </div>
</section>


<!-- ================= 프로필 편집 ================= -->
<div class="overlay" id="profileOverlay">

  <div class="sheet">

    <div class="grabber"></div>

    <h2>이름 및 사진 설정</h2>

    <div class="preview" id="profilePreview"></div>

    <button class="change" id="profilePhotoBtn">
      사진 변경
    </button>

    <input type="file" id="profilePhoto"
           accept="image/*" hidden>

    <div class="field">
      <label>이름</label>
      <input id="profileNameInput" maxlength="30">
    </div>

    <div class="field">
      <label>상태 메시지</label>
      <input id="profileStatusInput" maxlength="60">
    </div>

    <div class="sheet-buttons">
      <button class="cancel" id="profileCancel">취소</button>
      <button class="save" id="profileSave">저장</button>
    </div>

  </div>
</div>

</div>


<script>
"use strict";

/* =========================================================
   데이터
========================================================= */

const STORAGE = "messenger-demo-state-v3";

const COLORS = [
  "#ff9f0a",
  "#ff375f",
  "#30d158",
  "#0a84ff",
  "#bf5af2",
  "#64d2ff",
  "#ffd60a"
];

function uid(){
  return Math.random().toString(36).slice(2)+Date.now().toString(36);
}

function initials(name){
  const p=String(name||"나").trim().split(/\s+/);
  if(p.length===1) return p[0].slice(0,2);
  return (p[0][0]||"")+(p[1][0]||"");
}

function avatar(c){
  if(c.photo){
    return `<img src="${c.photo}" alt="">`;
  }
  return initials(c.name);
}

function colorFor(id){
  let n=0;
  for(const x of id){
    n=(n*31+x.charCodeAt(0))%997;
  }
  return COLORS[n%COLORS.length];
}

function esc(x){
  return String(x??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function time(ts){
  const d=new Date(ts);
  let h=d.getHours();
  const m=String(d.getMinutes()).padStart(2,"0");
  const ap=h>=12?"오후":"오전";
  h=h%12||12;
  return `${ap} ${h}:${m}`;
}

function day(ts){
  const d=new Date(ts);
  const w=["일","월","화","수","목","금","토"];
  return `${d.getMonth()+1}월 ${d.getDate()}일 ${w[d.getDay()]}요일`;
}

function sameDay(a,b){
  const x=new Date(a),y=new Date(b);
  return x.getFullYear()===y.getFullYear() &&
    x.getMonth()===y.getMonth() &&
    x.getDate()===y.getDate();
}

function messagesFor(id){
  return state.messages
    .filter(m=>m.characterId===id)
    .sort((a,b)=>a.ts-b.ts);
}

function lastMessage(id){
  const a=messagesFor(id);
  return a[a.length-1]||null;
}

function unreadCount(id){
  return state.messages.filter(
    m=>m.characterId===id &&
    m.sender==="them" &&
    !m.read
  ).length;
}

/* =========================================================

========================================================= */

function renderList(){

  const box=document.getElementById("conversationList");

  let chars=state.characters.filter(c=>c.active);

  if(unreadOnly){
    chars=chars.filter(c=>unreadCount(c.id)>0);
  }

  chars.sort((a,b)=>{
    const x=lastMessage(a.id);
    const y=lastMessage(b.id);
    return (y?.ts||0)-(x?.ts||0);
  });

  if(!chars.length){

    box.innerHTML=
      `<div class="empty">
        ${unreadOnly
          ?"읽지 않은 메시지가 없습니다."
          :"대화가 없습니다."}
      </div>`;

    return;
  }

  box.innerHTML=chars.map(c=>{

    const lm=lastMessage(c.id);
    const unread=unreadCount(c.id);
    const checked=selected.has(c.id);

    return `
      <div class="row ${checked?"selected":""}"
           data-id="${c.id}">

        ${editMode
          ? `<div class="check ${checked?"on":""}"></div>`
          : ""}

        <div class="avatar"
             style="background:${colorFor(c.id)}">
          ${avatar(c)}
        </div>

        <div class="row-main">

          <div class="row-top">
            <div class="name">${esc(c.name)}</div>
            <div class="time">${lm?time(lm.ts):""}</div>
          </div>

          <div style="display:flex;gap:6px;align-items:center">

            ${unread
              ? `<span class="unread"></span>`
              : ""}

            <div class="preview">
              ${lm
                ? esc((lm.sender==="me"?"나: ":"")+lm.text)
                : "대화 없음"}
            </div>

          </div>

        </div>

      </div>
    `;

  }).join("");

  box.querySelectorAll(".row").forEach(row=>{

    row.onclick=()=>{

      const id=row.dataset.id;

      if(editMode){

        if(selected.has(id))
          selected.delete(id);
        else
          selected.add(id);

        document.getElementById("editCount").textContent=
          `${selected.size}개 선택됨`;

        renderList();
        return;
      }

      openChat(id);
    };

  });

  document.getElementById("editCount").textContent=
    `${selected.size}개 선택됨`;
}

function openChat(id){

  currentChat=id;

  state.messages.forEach(m=>{
    if(m.characterId===id && m.sender==="them"){
      m.read=true;
    }
  });

  save();

  renderChat();

  listScreen.classList.add("left");
  chatScreen.classList.remove("hidden");

  renderList();
}

function closeChat(){

  currentChat=null;

  chatScreen.classList.add("hidden");
  listScreen.classList.remove("left");

  renderList();
}

document.getElementById("chatBack").onclick=closeChat;

function renderChat(){

  const c=state.characters.find(x=>x.id===currentChat);
  if(!c)return;

  document.getElementById("chatHeader").innerHTML=`
    <div class="avatar"
         style="background:${colorFor(c.id)}">
      ${avatar(c)}
    </div>
    <div class="chatname">
      ${esc(c.name)}　›
    </div>
  `;

  renderMessages();
}

function renderMessages(){

  const c=state.characters.find(x=>x.id===currentChat);
  if(!c)return;

  const box=document.getElementById("messages");
  const list=messagesFor(currentChat);

  let html="";
  let lastTs=null;
  let lastSender=null;

  list.forEach(m=>{

    if(
      lastTs===null ||
      m.ts-lastTs>30*60*1000 ||
      !sameDay(m.ts,lastTs)
    ){
      html+=`
        <div class="date">
          ${day(m.ts)} ${time(m.ts)}
        </div>
      `;
      lastSender=null;
    }

    html+=`
      <div class="msgrow ${m.sender}">
        <div
          class="bubble ${m.sender}"
          ${m.sender==="me"
            ? `style="--bubble-color:${c.bubbleColor||"#0a84ff"}"`
            : ""}
        >
          ${esc(m.text)}
        </div>
      </div>
    `;

    lastTs=m.ts;
    lastSender=m.sender;
  });

  if(list.length && list[list.length-1].sender==="me"){
    html+=`<div class="read">읽음</div>`;
  }

  box.innerHTML=html ||
    `<div class="empty">아직 메시지가 없습니다.</div>`;

  setTimeout(()=>{
    box.scrollTop=box.scrollHeight;
  },0);
}

function renderAdmin(){

  const list=document.getElementById("characterList");

  list.innerHTML=state.characters.map(c=>`

    <div class="char
      ${adminSelected===c.id?"selected":""}"
      data-char="${c.id}">

      <div class="avatar"
           style="background:${colorFor(c.id)}">
        ${avatar(c)}
      </div>

      <div class="char-info">
        <div class="char-name">${esc(c.name)}</div>
        <div class="char-phone">
          ${esc(c.phone||"")}
        </div>
      </div>

      <button class="danger"
              data-delete="${c.id}">
        ✕
      </button>

    </div>

  `).join("");

  list.querySelectorAll(".char").forEach(el=>{

    el.onclick=e=>{

      if(e.target.closest("[data-delete]"))return;

      adminSelected=el.dataset.char;
      renderAdmin();
      loadCharacterSettings();
    };

  });

  list.querySelectorAll("[data-delete]").forEach(btn=>{

    btn.onclick=e=>{

      e.stopPropagation();

      const id=btn.dataset.delete;

      if(!confirm("이 캐릭터와 대화를 삭제할까요?"))
        return;

      state.characters=
        state.characters.filter(c=>c.id!==id);

      state.messages=
        state.messages.filter(m=>m.characterId!==id);

      if(adminSelected===id)
        adminSelected=null;

      save();
      renderAdmin();
      renderList();

      document.getElementById("characterSettings")
        .style.display="none";
    };

  });
}

function loadCharacterSettings(){

  const c=state.characters.find(x=>x.id===adminSelected);

  if(!c)return;

  document.getElementById("characterSettings")
    .style.display="block";

  document.getElementById("settingsTitle").textContent=
    `${c.name} · 캐릭터 설정`;

  document.getElementById("characterName").value=c.name;
  document.getElementById("characterPhone").value=c.phone||"";

  document.getElementById("bubbleColor").value=
    c.bubbleColor||"#0a84ff";

  renderThread();
}

function renderThread(){

  if(!adminSelected)return;

  const box=document.getElementById("thread");
  const list=messagesFor(adminSelected);

  box.innerHTML=list.map(m=>`

    <div class="thread-msg ${m.sender}">

      <span class="thread-who">

              data-msg="${m.id}">
        🗑
      </button>

    </div>

  `).join("") ||
  `<div style="padding:10px;color:var(--sub)">
    메시지가 없습니다.
  </div>`;

  box.querySelectorAll("[data-msg]").forEach(btn=>{

    btn.onclick=()=>{

      state.messages=
        state.messages.filter(
          m=>m.id!==btn.dataset.msg
        );

      save();
      renderThread();
      renderList();

      if(currentChat===adminSelected)
        renderMessages();
    };

  });

  box.scrollTop=box.scrollHeight;
}

function dark(){

  document.body.classList.toggle(
    "dark",
    matchMedia("(prefers-color-scheme:dark)").matches

}
