<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>메시지</title>

<style>
:root{
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#bf5af2;

  --bg:#000;
  --card:#1c1c1e;
  --card2:#2c2c2e;
  --input:#1c1c1e;
  --text:#fff;
  --secondary:#98989f;
  --tertiary:#636366;
  --separator:rgba(84,84,88,.65);
  --nav:rgba(0,0,0,.88);
  --sheet:rgba(28,28,30,.96);
  --overlay:rgba(0,0,0,.58);
}

@media(prefers-color-scheme:light){
  :root{
    --bg:#fff;
    --card:#f2f2f7;
    --card2:#e5e5ea;
    --input:#f2f2f7;
    --text:#000;
    --secondary:#8e8e93;
    --tertiary:#aeaeb2;
    --separator:rgba(60,60,67,.18);
    --nav:rgba(255,255,255,.9);
    --sheet:rgba(248,248,250,.97);
    --overlay:rgba(0,0,0,.25);
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  background:#000;
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    Arial,
    sans-serif;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  -webkit-appearance:none;
  appearance:none;
}

button:active{
  opacity:.55;
}

input,
textarea{
  outline:none;
}

.app{
  position:relative;
  width:100%;
  max-width:430px;
  height:100dvh;
  min-height:100vh;
  margin:0 auto;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
  transform:translateX(0);
  transition:
    transform .34s cubic-bezier(.32,.72,0,1),
    opacity .25s;
  z-index:1;
}

.screen.right{
  transform:translateX(100%);
}

.screen.left{
  transform:translateX(-18%);
  filter:brightness(.7);
}

.hidden{
  display:none!important;
}

.scroll{
  flex:1;
  min-height:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}

::-webkit-scrollbar{
  width:0;
  height:0;
}

/* =========================================================
   STATUS / TOP
========================================================= */

.top-safe{
  height:env(safe-area-inset-top,0px);
  flex-shrink:0;
}

/* =========================================================
   LIST HEADER
========================================================= */

.list-header{
  flex-shrink:0;
  padding:
    calc(env(safe-area-inset-top,0px) + 8px)
    17px
    0;
}

.list-header-row{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-pill{
  min-width:92px;
  height:50px;
  padding:0 17px;
  border-radius:27px;
  border:1px solid rgba(120,120,128,.28);
  background:rgba(35,35,37,.82);
  color:#fff;
  font-size:18px;
  font-weight:500;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.04),
    0 1px 3px rgba(0,0,0,.2);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  cursor:pointer;
}

@media(prefers-color-scheme:light){
  .header-pill{
    background:rgba(242,242,247,.9);
    color:#000;
  }
}

.header-pill.icon{
  min-width:58px;
  width:58px;
  padding:0;
}

.header-pill svg{
  width:30px;
  height:30px;
}

.list-title{
  margin-top:18px;
  padding-bottom:18px;
  font-size:48px;
  line-height:1;
  font-weight:800;
  letter-spacing:-2.4px;
}

/* =========================================================
   PROFILE CARD
========================================================= */

.profile-card{
  flex-shrink:0;
  margin:0 16px 12px;
  min-height:112px;
  padding:15px 18px;
  border-radius:58px;
  background:#1c1c1e;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
}

@media(prefers-color-scheme:light){
  .profile-card{
    background:#f2f2f7;
  }
}

.profile-avatar{
  width:76px;
  height:76px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(135deg,#5e5ce6,#bf5af2);
  color:#fff;
  font-size:24px;
  font-weight:700;
}

.profile-avatar img,
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info{
  flex:1;
  min-width:0;
}

.profile-name{
  font-size:22px;
  font-weight:700;
  letter-spacing:-.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-status{
  margin-top:3px;
  color:#8e8e93;
  font-size:17px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-arrow{
  color:#8e8e93;
  font-size:39px;
  font-weight:200;
  line-height:1;
}

/* =========================================================
   CONVERSATIONS
========================================================= */

.conversation-list{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:
    2px
    0
    calc(env(safe-area-inset-bottom,0px) + 110px);
  -webkit-overflow-scrolling:touch;
}

.conversation-row{
  position:relative;
  min-height:100px;
  display:flex;
  align-items:center;
  padding:7px 17px 7px 27px;
  gap:15px;
  cursor:pointer;
}

.conversation-row:active{
  background:rgba(120,120,128,.09);
}

.conversation-avatar{
  width:58px;
  height:58px;
  flex:0 0 58px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#514d68,#302d42);
  color:#fff;
  font-size:18px;
  font-weight:700;
}

.conversation-main{
  flex:1;
  min-width:0;
  height:86px;
  padding:11px 0 10px;
  border-bottom:.5px solid var(--separator);
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.conversation-top{
  display:flex;
  align-items:center;
  gap:8px;
}

.conversation-name{
  flex:1;
  min-width:0;
  font-size:20px;
  font-weight:600;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversation-name.unread{
  font-weight:800;
}

.conversation-time{
  flex-shrink:0;
  color:var(--secondary);
  font-size:17px;
  white-space:nowrap;
}

.conversation-bottom{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:5px;
  min-width:0;
}

.unread-dot{
  width:10px;
  height:10px;
  flex:0 0 10px;
  border-radius:50%;
  background:var(--blue);
}

.conversation-preview{
  min-width:0;
  flex:1;
  color:#98989f;
  font-size:17px;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conversation-chevron{
  color:#636366;
  font-size:35px;
  line-height:1;
  font-weight:200;
}

.pin-icon{
  color:#98989f;
  font-size:14px;
}

.empty{
  padding:70px 25px;
  text-align:center;
  color:var(--secondary);
  font-size:16px;
  line-height:1.5;
}

/* =========================================================
   BOTTOM SEARCH
========================================================= */

.bottom-bar{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  padding:
    0
    14px
    calc(env(safe-area-inset-bottom,0px) + 15px);
  display:flex;
  align-items:center;
  gap:13px;
  pointer-events:none;
}

.search-bar{
  flex:1;
  height:62px;
  border-radius:32px;
  background:rgba(29,29,31,.96);
  border:1px solid rgba(120,120,128,.2);
  box-shadow:0 4px 18px rgba(0,0,0,.28);
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 17px;
  color:#98989f;
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  pointer-events:auto;
}

@media(prefers-color-scheme:light){
  .search-bar{
    background:rgba(242,242,247,.95);
  }
}

.search-icon{
  width:27px;
  height:27px;
  flex:0 0 27px;
}

.search-label{
  font-size:20px;
  color:#98989f;
}

.conversation-search-input{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:20px;
  padding:0;
}

.conversation-search-input::placeholder{
  color:#98989f;
}

.compose-button{
  width:62px;
  height:62px;
  flex:0 0 62px;
  border-radius:50%;
  background:rgba(29,29,31,.97);
  border:1px solid rgba(120,120,128,.22);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 18px rgba(0,0,0,.28);
  pointer-events:auto;
  cursor:pointer;
}

@media(prefers-color-scheme:light){
  .compose-button{
    background:rgba(242,242,247,.97);
    color:#000;
  }
}

.compose-button svg{
  width:30px;
  height:30px;
}

/* =========================================================
   EDIT MODE
========================================================= */

.edit-header{
  flex-shrink:0;
  padding:
    calc(env(safe-area-inset-top,0px) + 8px)
    17px
    0;
}

.edit-header-row{
  height:55px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

.edit-header-left{
  justify-self:start;
}

.edit-header-center{
  font-size:17px;
  font-weight:700;
}

.edit-header-right{
  justify-self:end;
}

.edit-text{
  color:var(--blue);
  background:none;
  font-size:17px;
  padding:8px 3px;
  cursor:pointer;
}

.edit-selection-count{
  text-align:center;
  color:var(--secondary);
  font-size:13px;
  padding:3px 0 14px;
}

.selection-circle{
  width:29px;
  height:29px;
  flex:0 0 29px;
  border-radius:50%;
  border:2px solid #77777c;
  display:flex;
  align-items:center;
  justify-content:center;
}

.selection-circle.selected{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}

.selection-circle svg{
  width:17px;
  height:17px;
}

/* =========================================================
   FILTER POPOVER
========================================================= */

.filter-backdrop{
  position:absolute;
  inset:0;
  z-index:80;
}

.filter-popover{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 76px);
  right:14px;
  width:275px;
  z-index:100;
  padding:7px;
  border-radius:22px;
  background:rgba(45,45,48,.94);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:
    0 18px 50px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.04);
  backdrop-filter:blur(30px) saturate(170%);
  -webkit-backdrop-filter:blur(30px) saturate(170%);
  animation:popoverIn .18s ease-out;
}

@media(prefers-color-scheme:light){
  .filter-popover{
    background:rgba(248,248,250,.96);
    border-color:rgba(60,60,67,.12);
  }
}

@keyframes popoverIn{
  from{
    opacity:0;
    transform:scale(.92) translateY(-5px);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.filter-item{
  min-height:48px;
  width:100%;
  border-radius:14px;
  background:none;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 13px;
  font-size:16px;
  cursor:pointer;
}

@media(prefers-color-scheme:light){
  .filter-item{
    color:#000;
  }
}

.filter-item:active{
  background:rgba(120,120,128,.15);
}

.filter-divider{
  height:.5px;
  background:rgba(120,120,128,.3);
  margin:4px 8px;
}

.filter-heading{
  padding:10px 13px 4px;
  color:#98989f;
  font-size:13px;
}

.filter-check{
  color:var(--blue);
  font-size:21px;
  font-weight:700;
}

.filter-radio{
  width:19px;
  height:19px;
  border-radius:50%;
  border:1.5px solid #98989f;
}

.filter-radio.active{
  border:5px solid var(--blue);
}

/* =========================================================
   EDIT BOTTOM ACTIONS
========================================================= */

.edit-actions{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  padding:
    10px 10px
    calc(env(safe-area-inset-bottom,0px) + 10px);
  background:var(--nav);
  border-top:.5px solid var(--separator);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.edit-action{
  min-height:45px;
  color:var(--blue);
  background:none;
  font-size:12px;
  cursor:pointer;
}

.edit-action.danger{
  color:var(--red);
}

.edit-action:disabled{
  opacity:.3;
}

/* =========================================================
   STANDARD NAV
========================================================= */

.standard-nav{
  flex-shrink:0;
  min-height:calc(env(safe-area-inset-top,0px) + 56px);
  padding:
    env(safe-area-inset-top,0px)
    14px
    0;
  display:grid;
  grid-template-columns:90px 1fr 90px;
  align-items:center;
  background:var(--nav);
  border-bottom:.5px solid var(--separator);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.standard-title{
  text-align:center;
  font-size:17px;
  font-weight:700;
}

.nav-button{
  background:none;
  color:var(--blue);
  font-size:17px;
  padding:8px 0;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:3px;
}

.nav-right{
  justify-self:end;
}

/* =========================================================
   CHAT
========================================================= */

.chat-nav{
  flex-shrink:0;
  padding:
    calc(env(safe-area-inset-top,0px) + 4px)
    10px
    4px;
  background:var(--nav);
  border-bottom:.5px solid var(--separator);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  z-index:10;
}

.chat-nav-row{
  height:78px;
  display:grid;
  grid-template-columns:88px 1fr 45px;
  align-items:start;
  position:relative;
}

.chat-back{
  width:86px;
  min-width:86px;
  height:44px;
  margin-top:0;
  padding:0 11px 0 8px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:5px;
  color:#fff;
  background:#1c1c1e;
  border:1px solid rgba(120,120,128,.28);
  font-size:16px;
  line-height:1;
  white-space:nowrap;
  cursor:pointer;
}

.chat-back svg{
  width:11px;
  height:20px;
  flex:0 0 11px;
}

.chat-contact{
  display:flex;
  flex-direction:column;
  align-items:center;
  min-width:0;
  cursor:pointer;
  margin-top:0;
}

.chat-avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#fff;
  font-size:11px;
  font-weight:700;
}

.chat-name{
  max-width:190px;
  min-height:30px;
  margin-top:3px;
  padding:4px 10px 4px 12px;
  border-radius:16px;
  border:1px solid rgba(120,120,128,.24);
  background:#1c1c1e;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-name-arrow{
  color:var(--secondary);
  font-size:10px;
}

.info-button{
  width:35px;
  height:35px;
  margin-top:3px;
  border-radius:50%;
  color:var(--blue);
  background:none;
  justify-self:end;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:8px 12px 14px;
  -webkit-overflow-scrolling:touch;
  display:flex;
  flex-direction:column;
}

.date-divider{
  color:var(--secondary);
  text-align:center;
  font-size:12px;
  font-weight:500;
  margin:13px 0 9px;
}

.message-time{
  color:var(--secondary);
  text-align:center;
  font-size:11px;
  margin:7px 0 3px;
}

.bubble-row{
  display:flex;
  margin:1px 0;
}

.bubble-row.me{
  justify-content:flex-end;
}

.bubble-row.them{
  justify-content:flex-start;
}

.bubble{
  width:fit-content;
  max-width:78%;
  padding:9px 13px;
  color:#fff;
  font-size:17px;
  line-height:1.28;
  white-space:pre-wrap;
  word-break:break-word;
  border-radius:20px;
  box-sizing:border-box;
  text-align:left;
  flex:0 0 auto;
}

.bubble.me{
  background:var(--blue);
  border-bottom-right-radius:5px;
}

.bubble.them{
  border-bottom-left-radius:5px;
}

.bubble-row.same.me .bubble{
  border-top-right-radius:5px;
}

.bubble-row.same.them .bubble{
  border-top-left-radius:5px;
}

.read-receipt{
  color:var(--secondary);
  text-align:right;
  font-size:11px;
  margin:3px 7px;
}

.input-area{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:
    8px 10px
    calc(env(safe-area-inset-bottom,0px) + 8px);
  background:var(--nav);
  border-top:.5px solid var(--separator);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.plus-button{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border:1.5px solid var(--secondary);
  border-radius:50%;
  color:var(--secondary);
  background:none;
  font-size:25px;
  line-height:1;
  cursor:pointer;
}

.message-input-wrap{
  flex:1;
  min-width:0;
  min-height:36px;
  border-radius:20px;
  background:var(--input);
  border:1px solid var(--separator);
  display:flex;
  align-items:flex-end;
}

.message-input{
  width:100%;
  min-height:34px;
  max-height:120px;
  resize:none;
  border:0;
  background:none;
  color:var(--text);
  padding:7px 12px;
  font-size:16px;
  line-height:1.3;
}

.message-input::placeholder{
  color:var(--secondary);
}

.send-button{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  opacity:.25;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.send-button.ready{
  opacity:1;
  pointer-events:auto;
}

.send-button svg{
  width:16px;
  height:16px;
}

/* =========================================================
   GROUPED SETTINGS
========================================================= */

.group-page{
  flex:1;
  min-height:0;
  overflow-y:auto;
  background:var(--card);
  padding:
    20px
    0
    calc(env(safe-area-inset-bottom,0px) + 25px);
}

.settings-section-title{
  padding:0 17px 7px;
  color:var(--secondary);
  font-size:13px;
}

.settings-card{
  margin-bottom:24px;
  background:var(--card2);
  border-top:.5px solid var(--separator);
  border-bottom:.5px solid var(--separator);
}

.settings-row{
  min-height:55px;
  width:100%;
  padding:0 17px;
  display:flex;
  align-items:center;
  gap:12px;
  background:none;
  color:var(--text);
  border-bottom:.5px solid var(--separator);
  text-align:left;
  cursor:pointer;
}

.settings-row:last-child{
  border-bottom:0;
}

.settings-main{
  flex:1;
  min-width:0;
}

.settings-title{
  font-size:16px;
}

.settings-sub{
  color:var(--secondary);
  font-size:13px;
  margin-top:2px;
}

.settings-chevron{
  color:#636366;
  font-size:26px;
}

.ios-switch{
  width:51px;
  height:31px;
  padding:2px;
  border-radius:16px;
  background:#787880;
  cursor:pointer;
  flex:0 0 51px;
  transition:.2s;
}

.ios-switch span{
  display:block;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:.2s;

.ios-switch.on{

========================================================= */

}

.detail-hero{

  background:var(--bg);
}

.big-avatar{

  height:108px;

  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#5e5ce6,#bf5af2);
  color:#fff;
  font-size:34px;
  font-weight:700;
}

.detail-name{
  margin-top:12px;
  font-size:24px;
  font-weight:700;
}

.detail-sub{
  color:var(--secondary);
  font-size:14px;
  margin-top:3px;
}

.photo-button{
  margin-top:10px;
  color:var(--blue);
  background:none;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.text-field{
  width:100%;
  border:0;
  background:none;
  color:var(--text);
  font-size:16px;
  padding:0;
}

.color-row{
  padding:15px 17px;
  display:flex;
  align-items:center;
  gap:12px;
}

.color-preview{
  width:38px;
  height:38px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.7);
}

.color-row input[type=color]{
  width:50px;
  height:36px;
  border:0;
  background:none;
}

/* =========================================================
   NEW MESSAGE
========================================================= */

.search-input-row{
  margin:10px 16px;
  height:39px;
  border-radius:10px;
  background:var(--card2);
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 11px;
  color:var(--secondary);
}

.search-input-row input{
  flex:1;
  min-width:0;
  border:0;
  background:none;
  color:var(--text);
  font-size:16px;
}

.character-row{
  width:100%;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 17px;
  background:none;
  color:var(--text);
  text-align:left;
  cursor:pointer;
}

.character-row:active{
  background:var(--card2);
}

.character-avatar-small{
  width:50px;
  height:50px;
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:16px;
  font-weight:700;
}

.character-row-name{
  font-size:17px;
  font-weight:600;
}

.character-row-phone{
  color:var(--secondary);
  font-size:13px;
  margin-top:2px;
}

/* =========================================================
   ADMIN
========================================================= */

.admin-character-row{
  min-height:66px;
}

.admin-character-avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:14px;
  font-weight:700;
}

.admin-note{
  padding:0 17px;
  color:var(--secondary);
  font-size:13px;
  line-height:1.45;
}

.primary{
  background:var(--blue);
  color:#fff;
  border-radius:10px;
  padding:9px 15px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

/* =========================================================
   ADMIN CONVERSATION
========================================================= */

.admin-thread{
  padding:10px 12px 20px;
}

.admin-message{
  background:var(--card2);
  border-bottom:.5px solid var(--separator);
  padding:11px;
  display:flex;
  gap:9px;
}

.admin-who{
  width:50px;
  flex:0 0 50px;
  color:var(--secondary);
  font-size:12px;
}

.admin-text{
  flex:1;
  min-width:0;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:14px;
  line-height:1.35;
}

.admin-time{
  margin-top:3px;
  color:var(--secondary);
  font-size:11px;
}

.admin-delete{
  background:none;
  color:var(--secondary);
  font-size:19px;
  cursor:pointer;
}

.admin-composer{
  margin:0 12px;
  border-radius:15px;
  overflow:hidden;
  background:var(--card2);
  border:.5px solid var(--separator);
}

.admin-textarea{
  display:block;
  width:100%;
  min-height:100px;
  padding:12px;
  resize:none;
  border:0;
  background:none;
  color:var(--text);
  font-size:16px;
}

.admin-date-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:7px;
  padding:9px;
  border-top:.5px solid var(--separator);
}

.admin-date-row input{
  min-width:0;
  height:35px;
  border:0;
  border-radius:8px;
  background:var(--input);
  color:var(--text);
  padding:0 7px;
  font-size:13px;
}

.now-button{
  border:0;
  border-radius:8px;
  background:var(--input);
  color:var(--blue);
  padding:0 10px;
  cursor:pointer;
}

.admin-send-row{
  padding:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-top:.5px solid var(--separator);
}

.admin-hint{
  color:var(--secondary);
  font-size:11px;
}

/* =========================================================
   CONTACT
========================================================= */

.contact-page{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:25px 20px;
  text-align:center;
  background:var(--card);
}

.contact-name{
  margin-top:13px;
  font-size:25px;
  font-weight:700;
}

.contact-phone{
  color:var(--secondary);
  font-size:14px;
  margin-top:3px;
}

.contact-actions{
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:27px;
}

.contact-action{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.contact-action button{
  width:55px;
  height:55px;
  border-radius:50%;
  background:var(--card2);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.contact-action span{
  color:var(--secondary);
  font-size:12px;
}

/* =========================================================
   DELETED
========================================================= */

.deleted-info{
  padding:15px 17px 5px;
  color:var(--secondary);
  font-size:13px;
  line-height:1.45;
}

.deleted-row-actions{
  display:flex;
  gap:5px;
}

.inline-button{
  background:none;
  color:var(--blue);
  padding:5px;
  font-size:13px;
  cursor:pointer;
}

.inline-button.red{
  color:var(--red);
}

/* =========================================================
   SHEET
========================================================= */

.sheet-cover{
  position:absolute;
  inset:0;
  z-index:500;
  display:flex;
  align-items:flex-end;
  background:var(--overlay);
  opacity:0;
  pointer-events:none;
  transition:.22s;
}

.sheet-cover.open{
  opacity:1;
  pointer-events:auto;
}

.bottom-sheet{
  width:100%;
  max-height:88%;
  overflow-y:auto;
  padding:
    8px 15px
    calc(env(safe-area-inset-bottom,0px) + 18px);
  border-radius:25px 25px 0 0;
  background:var(--sheet);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
}

.sheet-cover.open .bottom-sheet{
  transform:translateY(0);
}

.grabber{
  width:38px;
  height:5px;
  margin:3px auto 15px;
  border-radius:5px;
  background:#8e8e93;
  opacity:.55;
}

.sheet-title{
  margin-bottom:12px;
  text-align:center;
  font-size:20px;
  font-weight:700;
}

.sheet-button{
  width:100%;
  min-height:50px;
  border-bottom:.5px solid var(--separator);
  background:none;
  color:var(--blue);
  font-size:17px;
  cursor:pointer;
}

.sheet-button.red{
  color:var(--red);
}

.sheet-cancel{
  width:100%;
  height:52px;
  margin-top:12px;
  border-radius:15px;
  background:var(--card2);
  color:var(--blue);
  font-size:17px;
  font-weight:600;
  cursor:pointer;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:absolute;
  z-index:700;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 95px);
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:11px 16px;
  border-radius:16px;
  background:rgba(42,42,44,.92);
  color:#fff;
  font-size:14px;
  white-space:nowrap;
  transition:.2s;
  backdrop-filter:blur(20px);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(min-width:431px){
  .app{
    box-shadow:0 0 45px rgba(0,0,0,.4);
  }
}

@media(max-width:370px){
  .list-title{
    font-size:42px;
  }

  .conversation-row{
    padding-left:20px;
  }

  .conversation-avatar{
    width:53px;
    height:53px;
    flex-basis:53px;
  }

  .conversation-name{
    font-size:18px;
  }

  .conversation-preview{
    font-size:15px;
  }
}
</style>

function uid(){
  return (

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function initials(name){
  const value = String(name || "").trim();

  if(!value){
    return "나";
  }

  const parts = value.split(/\s+/);

  if(parts.length > 1){
    return (
      (parts[0][0] || "") +
      (parts[1][0] || "")
    );
  }

  return value.slice(0,2);
}

function colorFor(id){
  let hash = 0;

  for(const char of String(id || "")){
    hash =
      (hash * 31 + char.charCodeAt(0)) %
      997;
  }

  return COLORS[hash % COLORS.length];
}

function normalizeTimestamp(value){
  if(
    typeof value === "number" &&
    Number.isFinite(value)
  ){
    return value;
  }

  const date = new Date(value).getTime();

  return Number.isFinite(date)

}

function formatTime(ts){
  const date = new Date(ts);

  let hour = date.getHours();

  const period =
    hour >= 12
      ? "오후"
      : "오전";

  hour %= 12;

  if(hour === 0){
    hour = 12;
  }

  return (
    period +
    " " +
    hour +
    ":" +
    String(date.getMinutes()).padStart(2,"0")
  );
}

function sameDay(a,b){
  const x = new Date(a);
  const y = new Date(b);

  return (
    x.getFullYear() === y.getFullYear() &&
    x.getMonth() === y.getMonth() &&
    x.getDate() === y.getDate()
  );
}

function formatDate(ts){
  const date = new Date(ts);
  const now = new Date();

  if(
    date.getFullYear() === now.getFullYear() &&
    date.getMonth() === now.getMonth() &&
    date.getDate() === now.getDate()
  ){
    return "오늘";
  }

  return (
    date.getFullYear() +
    "년 " +
    (date.getMonth()+1) +
    "월 " +
    date.getDate() +
    "일"
  );
}

function formatConversationTime(ts){
  const date = new Date(ts);
  const now = new Date();

  if(sameDay(date,now)){
    return formatTime(ts);
  }

  const yesterday = new Date(now);
  yesterday.setDate(
    yesterday.getDate() - 1
  );

  if(sameDay(date,yesterday)){
    return "어제";
  }

  if(
    date.getFullYear() ===
    now.getFullYear()
  ){
    return (
      (date.getMonth()+1) +
      ". " +
      date.getDate() +
      "."
    );
  }

  return (
    date.getFullYear() +
    ". " +
    (date.getMonth()+1) +
    ". " +
    date.getDate() +
    "."
  );
}

function toDateInput(ts){
  const date = new Date(ts);

  return (
    date.getFullYear() +
    "-" +
    String(date.getMonth()+1).padStart(2,"0") +
    "-" +
    String(date.getDate()).padStart(2,"0")
  );
}

function toTimeInput(ts){
  const date = new Date(ts);

  return (
    String(date.getHours()).padStart(2,"0") +
    ":" +
    String(date.getMinutes()).padStart(2,"0")
  );
}

function combineDateTime(date,time){
  if(!date){
    return Date.now();
  }

  const result =
    new Date(
      `${date}T${time || "00:00"}:00`
    ).getTime();

  return Number.isFinite(result)
    ? result
    : Date.now();
}

/* =========================================================
   MIGRATION
========================================================= */

function migrate(raw){

  const defaults = seedData();

  if(!raw || typeof raw !== "object"){
    return defaults;
  }

  if(
    !raw.profile ||
    typeof raw.profile !== "object"
  ){
    raw.profile = {};
  }

  raw.profile.name =
    raw.profile.name ||
    defaults.profile.name;

  raw.profile.status =
    raw.profile.status ||
    defaults.profile.status;

  raw.profile.photo =
    typeof raw.profile.photo === "string"
      ? raw.profile.photo
      : "";

  raw.profile.bubbleColor =
    typeof raw.profile.bubbleColor === "string" && raw.profile.bubbleColor
      ? raw.profile.bubbleColor
      : "#0a84ff";

  if(
    !raw.settings ||
    typeof raw.settings !== "object"
  ){
    raw.settings = {};
  }

  raw.settings.spamFiltering =
    !!raw.settings.spamFiltering;

  raw.settings.unknownFiltering =
    !!raw.settings.unknownFiltering;

  raw.settings.smsFiltering =
    !!raw.settings.smsFiltering;

  if(!Array.isArray(raw.characters)){
    raw.characters = [];
  }

  if(!Array.isArray(raw.messages)){
    raw.messages = [];
  }

  raw.characters =
    raw.characters.map((character,index) => {

      const c = character || {};

      return {
        id:String(
          c.id ||
          uid()
        ),

        name:String(
          c.name ||
          `캐릭터 ${index+1}`
        ),

        phone:String(
          c.phone || ""
        ),

        photo:
          typeof c.photo === "string"
            ? c.photo
            : "",

        active:
          c.active !== false,

        bubbleColor:
          typeof c.bubbleColor === "string" &&
          c.bubbleColor
            ? c.bubbleColor
            : "#0a84ff",

        pinned:
          !!c.pinned,

        spam:
          !!c.spam,

        deleted:
          !!c.deleted,

        deletedAt:
          c.deletedAt ||
          null
      };
    });

  raw.messages =
    raw.messages.map(message => {

      const m = message || {};

      return {
        id:String(
          m.id ||
          uid()
        ),

        characterId:String(
          m.characterId ||
          m.character ||
          m.charId ||
          ""
        ),

        sender:
          m.sender === "me"
            ? "me"
            : "them",

        text:String(
          m.text || ""
        ),

        ts:
          normalizeTimestamp(
            m.ts ||
            m.timestamp ||
            Date.now()
          ),

        readByUser:
          m.sender === "me"
            ? true
            : !!m.readByUser
      };
    });

  raw.version = 4;

  return raw;
}

function loadState(){

  try{

    let raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    /*
      기존 프로젝트의 다른 키가 혹시 존재할 경우
      가능한 범위에서 가져온다.
    */

    if(!raw){

      const fallbackKeys = [
        "messenger-state",
        "messengerState",
        "messageState",
        "messages-state"
      ];

      for(const key of fallbackKeys){

        const value =
          localStorage.getItem(key);

        if(value){

          raw = value;
          break;

        }

      }

    }

    state =
      raw
        ? migrate(JSON.parse(raw))
        : seedData();

  }catch(error){

    console.error(error);

    state = seedData();

  }

  saveState(true);
}

let saveTimer;

function saveState(immediate=false){

  clearTimeout(saveTimer);

  const save = () => {

    try{

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );

    }catch(error){

      console.error(
        "localStorage 저장 실패",
        error
      );

    }

  };

  if(immediate){
    save();
  }else{
    saveTimer =
      setTimeout(save,80);
  }
}

function visibleCharacters(){

      c => c.active !== false

  if(currentFilter === "messages"){

    characters =

          !c.spam
      );

  }

  if(currentFilter === "spam"){

    characters =
      characters.filter(
        c =>
          !c.deleted &&
          c.spam
      );

  }

  if(currentFilter === "deleted"){

    characters =
      characters.filter(
        c => c.deleted
      );

  }

  if(unreadOnly){

    characters =
      characters.filter(
        c =>
          unreadCount(c.id) > 0
      );

  }

  const search =
    String(conversationSearchQuery || "")
      .trim()
      .toLowerCase();

  if(search){
    characters =
      characters.filter(character => {
        const text =
          messagesFor(character.id)
            .map(message => message.text)
            .join(" ");

        return (
          String(character.name || "").toLowerCase().includes(search) ||
          String(character.phone || "").toLowerCase().includes(search) ||
          text.toLowerCase().includes(search)
        );
      });
  }

  return characters.sort((a,b) => {

    if(currentFilter !== "deleted"){

      if(
        !!a.pinned !==
        !!b.pinned
      ){
        return a.pinned
          ? -1
          : 1;
      }

    }

    const aLast =
      lastMessage(a.id);

    const bLast =
      lastMessage(b.id);

    const aTime =
      currentFilter === "deleted"
        ? (a.deletedAt || 0)
        : (aLast?.ts || 0);

    const bTime =
      currentFilter === "deleted"
        ? (b.deletedAt || 0)
        : (bLast?.ts || 0);

    return bTime - aTime;

  });
}

function renderConversationList(){

  const list =
    document.getElementById(
      "conversationList"
    );

  if(currentFilter === "deleted"){
    renderDeletedInline();
    return;
  }

    visibleCharacters();

      "대화가 없습니다.";

    }

    }

  list.innerHTML =

        lastMessage(character.id);

        unreadCount(character.id) > 0;

      const selected =
        selectedIds.has(

        "대화 없음";

      if(last){

      }

      return `
        <div

          data-id="${escapeHtml(character.id)}">

          ${

                    selected

                      : ""

                      `
                      : ""
                  }

              `
              : ""

          <div
            class="conversation-avatar"

                      )

                }

              ${
                unread
                  ? `

                    </span>
                  `

              }

              <div class="conversation-preview">

                ${escapeHtml(preview)}

              </div>

            </div>

          </div>

          <div class="conversation-chevron">
            ›
          </div>

        </div>
      `;

    }).join("");

  list
    .querySelectorAll(
      ".conversation-row"
    )
    .forEach(row => {

      row.onclick = () => {

        const id =
          row.dataset.id;

        if(editMode){

function renderDeletedInline(){

  const list =
    document.getElementById(
      "conversationList"
    );

  const deleted =
    state.characters
      .filter(c => c.deleted)
      .sort(
        (a,b) =>
          (b.deletedAt || 0) -
          (a.deletedAt || 0)
      );

  if(!deleted.length){

    list.innerHTML =
      `<div class="empty">
        최근 삭제된 대화가 없습니다.
      </div>`;

    return;
  }

  list.innerHTML =
    `
      <div class="deleted-info">
        삭제된 대화는 여기에서 복구하거나
        영구적으로 삭제할 수 있습니다.
      </div>
    ` +
    deleted.map(character => {

      const last =
        lastMessage(character.id);

      return `
        <div
          class="conversation-row"
          data-id="${escapeHtml(character.id)}">

          <div

                ${escapeHtml(character.name)}
              </div>

              <div
                class="deleted-row-actions">

                <button
                  class="inline-button"
                  data-restore="${escapeHtml(character.id)}">
                  복구
                </button>

                <button
                  class="inline-button red"
                  data-permanent="${escapeHtml(character.id)}">
                  삭제
                </button>

              </div>

            </div>

            <div class="conversation-bottom">

              <div class="conversation-preview">
                ${
                  escapeHtml(
                    last?.text ||
                    "대화 없음"
                  )
                }
              </div>

            </div>

          </div>

        </div>
      `;

    }).join("");

  list
    .querySelectorAll(
      "[data-restore]"
    )
    .forEach(button => {

      button.onclick = event => {

        event.stopPropagation();

        restoreConversation(
          button.dataset.restore

      };

    });

  list
    .querySelectorAll(
      "[data-permanent]"
    )
    .forEach(button => {

      button.onclick = event => {

        event.stopPropagation();

        permanentlyDeleteConversation(
          button.dataset.permanent
        );

      };

    });
}

function updateFilterPopover(){

  document
    .getElementById("checkMessages")
    .classList.toggle(
      "hidden",
      currentFilter !== "messages"
    );

  document
    .getElementById("checkSpam")
    .classList.toggle(
      "hidden",
      currentFilter !== "spam"
    );

  document
    .getElementById("checkDeleted")
    .classList.toggle(
      "hidden",
      currentFilter !== "deleted"
    );

  document
    .getElementById("unreadRadio")
    .classList.toggle(
      "active",
      unreadOnly
    );
}

function openFilter(){

  updateFilterPopover();

  document
    .getElementById("filterBackdrop")
    .classList.remove("hidden");

  document
    .getElementById("filterPopover")
    .classList.remove("hidden");
}

function closeFilter(){

  document
    .getElementById("filterBackdrop")
    .classList.add("hidden");

  document
    .getElementById("filterPopover")
    .classList.add("hidden");
}

function setFilter(filter){

  currentFilter =
    filter;

  if(filter === "deleted"){
    unreadOnly = false;
  }

  closeFilter();

  document
    .getElementById("listTitle")
    .textContent =
      filter === "spam"
        ? "스팸"
        : filter === "deleted"
          ? "최근 삭제된 항목"
          : "메시지";

  renderConversationList();
}


/* =========================================================
   EDIT MODE
========================================================= */

function setEditMode(enabled){

  editMode =
    enabled;

  selectedIds.clear();

  document
    .getElementById("listHeader")
    .classList.toggle(
      "hidden",
      enabled
    );

  document
    .getElementById("editHeader")
    .classList.toggle(
      "hidden",
      !enabled
    );

  document
    .getElementById("profileRow")
    .classList.toggle(
      "hidden",
      enabled
    );

  document
    .getElementById("bottomBar")
    .classList.toggle(
      "hidden",
      enabled
    );

  document
    .getElementById("editActions")
    .classList.toggle(
      "hidden",
      !enabled
    );

  renderConversationList();
}

function toggleSelected(id){

  if(selectedIds.has(id)){
    selectedIds.delete(id);
  }else{
    selectedIds.add(id);
  }

  renderConversationList();
}

function selectAll(){

  const characters =
    visibleCharacters();

  const allSelected =
    characters.length > 0 &&
    characters.every(
      c => selectedIds.has(c.id)
    );

  if(allSelected){

    selectedIds.clear();

  }else{

    characters.forEach(
      c => selectedIds.add(c.id)
    );

  }

  renderConversationList();
}

function selectedCharacters(){

  return state.characters.filter(
    c => selectedIds.has(c.id)
  );

}

function updateEditControls(){

  if(!editMode){
    return;
  }

  const count =
    selectedIds.size;

  document
    .getElementById(
      "editSelectionCount"
    )
    .textContent =
      count
        ? `${count}개 선택됨`
        : "선택된 대화 없음";

  const buttons = [
    "readSelectedButton",
    "unreadSelectedButton",
    "pinSelectedButton",
    "deleteSelectedButton",
    "spamSelectedButton"
  ];

  buttons.forEach(id => {

    document
      .getElementById(id)
      .disabled =
        count === 0;

  });

  const chars =
    selectedCharacters();

  const allPinned =
    chars.length > 0 &&
    chars.every(
      c => c.pinned
    );

  document
    .getElementById(
      "pinSelectedButton"
    )
    .textContent =
      allPinned
        ? "고정 해제"
        : "고정";
}

function markSelectedRead(read){

  selectedCharacters()
    .forEach(character => {

      state.messages.forEach(message => {

        if(
          message.characterId ===
            character.id &&
          message.sender === "them"
        ){
          message.readByUser =
            read;
        }

      });

    });

  saveState();

  renderConversationList();

  showToast(
    read
      ? "읽음으로 표시했습니다"
      : "읽지 않음으로 표시했습니다"
  );
}

function toggleSelectedPin(){

  const chars =
    selectedCharacters();

  if(!chars.length){
    return;
  }

  const allPinned =
    chars.every(
      c => c.pinned
    );

  chars.forEach(
    c => {
      c.pinned =
        !allPinned;
    }
  );

  saveState();

  renderConversationList();

  showToast(
    allPinned
      ? "고정을 해제했습니다"
      : "대화를 고정했습니다"
  );
}

function deleteSelected(){

  const chars =
    selectedCharacters();

  if(!chars.length){
    return;
  }

  chars.forEach(c => {

    c.deleted = true;
    c.deletedAt =
      Date.now();
    c.pinned = false;

  });

  selectedIds.clear();

  saveState();

  renderConversationList();

  showToast(
    "최근 삭제된 항목으로 이동했습니다"
  );
}

function spamSelected(){

  const chars =
    selectedCharacters();

  if(!chars.length){
    return;
  }

  chars.forEach(c => {
    c.spam = true;
  });

  selectedIds.clear();

  saveState();

  renderConversationList();

  showToast(
    "스팸으로 이동했습니다"
  );
}


/* =========================================================
   CHAT
========================================================= */

function openChat(id){

  const character =
    characterById(id);

  if(
    !character ||
    character.deleted
  ){
    return;
  }

  currentChatId =
    id;

  state.messages.forEach(message => {

    if(
      message.characterId === id &&
      message.sender === "them"
    ){
      message.readByUser =
        true;
    }

  });

  saveState();

  renderChat();

  openScreen(
    screens.chat
  );

  renderConversationList();
}

function closeChat(){

  currentChatId = null;

  closeScreen(
    screens.chat
  );

  // 목록 화면을 항상 복구하여 채팅방에서 확실히 나올 수 있게 한다.
  screens.list.classList.remove("right");
  screens.list.classList.remove("left");

  renderConversationList();
}

function renderChat(){

  const character =
    characterById(
      currentChatId
    );

  if(!character){
    return;
  }

  document
    .getElementById("chatName")
    .textContent =
      character.name;

  setAvatar(
    document.getElementById(
      "chatAvatar"
    ),
    character
  );

  renderMessages();

}

function renderMessages(){

  const area =
    document.getElementById(
      "messagesArea"
    );

  const character =
    characterById(
      currentChatId
    );

  if(!character){
    area.innerHTML = "";
    return;
  }

  const messages =
    messagesFor(
      currentChatId
    );

  if(!messages.length){

    area.innerHTML =
      `<div class="empty">
        아직 메시지가 없습니다.
      </div>`;

    return;
  }

  let html = "";

  messages.forEach(
    (message,index) => {

      const previous =
        messages[index - 1];

      const next =
        messages[index + 1];

      if(
        !previous ||
        !sameDay(
          previous.ts,
          message.ts
        )
      ){

        html += `
          <div class="date-divider">
            ${formatDate(message.ts)}
          </div>
        `;

      }

      const showTime =
        !previous ||
        previous.sender !==
          message.sender ||
        message.ts -
          previous.ts >
          30*60000 ||
        !sameDay(
          previous.ts,
          message.ts
        );

      if(showTime){

        html += `
          <div class="message-time">
            ${formatTime(message.ts)}
          </div>
        `;

      }

      const samePrevious =
        previous &&
        previous.sender ===
          message.sender &&
        sameDay(
          previous.ts,
          message.ts
        ) &&
        message.ts -
          previous.ts <=
          30*60000;

      const sameNext =
        next &&
        next.sender ===
          message.sender &&
        sameDay(
          next.ts,
          message.ts
        ) &&
        next.ts -
          message.ts <=
          30*60000;

      const bubbleColor =
        message.sender === "them"
          ? (character.bubbleColor || "#0a84ff")
          : (state.profile.bubbleColor || "#0a84ff");

      html += `
        <div
          class="bubble-row ${
            message.sender
          } ${
            samePrevious
              ? "same"
              : ""
          }">

          <div
            class="bubble ${
              message.sender
            }"
            style="
              background:${escapeHtml(
                bubbleColor
              )};
            ">${escapeHtml(message.text)}</div>

        </div>
      `;

    }
  );

  const last =
    messages[messages.length - 1];

  if(
    last &&
    last.sender === "me"
  ){

    html += `
      <div class="read-receipt">
        읽음
      </div>
    `;

  }

  area.innerHTML =
    html;

  requestAnimationFrame(() => {

    area.scrollTop =
      area.scrollHeight;

  });
}

function sendUserMessage(){

  const input =
    document.getElementById(
      "userMessageInput"
    );

  const text =
    input.value.trim();

  if(
    !text ||
    !currentChatId
  ){
    return;
  }

  state.messages.push({

    id:uid(),

    characterId:
      currentChatId,

    sender:"me",

    text,

    ts:Date.now(),

    readByUser:true

  });

  input.value = "";

  input.style.height =
    "auto";

  document
    .getElementById(
      "userSendButton"
    )
    .classList.remove(
      "ready"
    );

  saveState();

  renderMessages();

  renderConversationList();
}

function resizeUserInput(){

  const input =
    document.getElementById(
      "userMessageInput"
    );

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      120
    ) + "px";

  document
    .getElementById(
      "userSendButton"
    )
    .classList.toggle(
      "ready",
      !!input.value.trim()
    );
}

function openNewMessage(){

  renderCharacterPicker("");

  document
    .getElementById(
      "characterSearchInput"
    )
    .value = "";

  openScreen(
    screens.newMessage
  );

}

function renderCharacterPicker(query){

  const list =
    document.getElementById(
      "characterPickerList"
    );

  const search =
    String(query || "")
      .trim()
      .toLowerCase();

  const characters =
    state.characters
      .filter(
        c =>
          !c.deleted &&
          c.active !== false
      )
      .filter(c => {

        if(!search){
          return true;
        }

        return (
          c.name
            .toLowerCase()
            .includes(search) ||
          String(c.phone || "")
            .includes(search)
        );

      });

  if(!characters.length){

    list.innerHTML =
      `<div class="empty">
        일치하는 캐릭터가 없습니다.
      </div>`;

    return;
  }

  list.innerHTML =
    characters.map(character => `

      <button
        class="character-row"
        data-character="${escapeHtml(character.id)}">

        <div
          class="character-avatar-small"
          style="
            background:${colorFor(character.id)}
          ">

          ${avatarHtml(character)}

        </div>

        <div>

          <div class="character-row-name">
            ${escapeHtml(character.name)}
          </div>

          <div class="character-row-phone">
            ${escapeHtml(
              character.phone || ""
            )}
          </div>

        </div>

      </button>

    `).join("");

  list
    .querySelectorAll(
      "[data-character]"
    )
    .forEach(button => {

      button.onclick = () => {

        closeScreen(
          screens.newMessage
        );

        setTimeout(() => {

          openChat(
            button.dataset.character
          );

        },120);

      };

    });
}

      .getElementById(

      )
      .value.trim() ||

    document
      .getElementById(
        "characterPhoneInput"
      )
      .value.trim();

  character.bubbleColor =
    document
      .getElementById(
        "characterColorInput"
      )
      .value ||
    "#0a84ff";

  renderAdminCharacters();
  renderConversationList();

    character.id

    screens.characterDetail

    return;
  }

  box.innerHTML =
    messages.map(message => `

            message.sender === "them"
              ? "캐릭터"

        <button
          class="admin-delete"

          ×
        </button>

function setAdminNow(){

  const now =
    Date.now();

  document
    .getElementById(
      "adminDateInput"
    )
    .value =
      toDateInput(now);

  document
    .getElementById(
      "adminTimeInput"
    )
    .value =
      toTimeInput(now);
}

function sendAdminMessage(){

  const input =
    document.getElementById(
      "adminMessageInput"
    );

  const text =
    input.value.trim();

  if(
    !text ||
    !adminConversationCharacterId
  ){
    return;
  }

  const timestamp =
    combineDateTime(
      document
        .getElementById(
          "adminDateInput"
        )
        .value,

      document
        .getElementById(
          "adminTimeInput"
        )
        .value
    );

  state.messages.push({

    id:uid(),

    characterId:
      adminConversationCharacterId,

    sender:"them",

    text,

    ts:timestamp,

    readByUser:false

  });

  input.value = "";

  saveState();

  renderAdminThread();
  renderConversationList();

  if(
    currentChatId ===
    adminConversationCharacterId
  ){
    renderMessages();
  }

  showToast(
    "캐릭터 메시지를 전송했습니다"
  );
}

    deleted.map(character => `

      <div
        class="conversation-row">

          class="conversation-avatar"
          style="
            background:${colorFor(character.id)}

          ${avatarHtml(character)}

              data-full-delete="${escapeHtml(character.id)}">
              영구 삭제
            </button>

  list

/* =========================================================
   IMAGE
========================================================= */

function readImage(
  file,
  callback
){

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload = () => {

    openImageCropper(
      String(reader.result || ""),
      callback
    );

  };

  reader.readAsDataURL(file);
}

let cropImageElement = null;
let cropCallback = null;
let cropScale = 1;
let cropX = 0;
let cropY = 0;
let cropDragging = false;
let cropStartX = 0;
let cropStartY = 0;
let cropBaseX = 0;
let cropBaseY = 0;

function ensureCropper(){

  if(document.getElementById("imageCropModal")){
    return;
  }

  const style = document.createElement("style");
  style.textContent = `
    #imageCropModal{position:absolute;inset:0;z-index:1000;background:rgba(0,0,0,.96);display:none;flex-direction:column;color:#fff}
    #imageCropModal.open{display:flex}
    .crop-header{height:58px;padding:calc(env(safe-area-inset-top,0px) + 6px) 16px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .crop-title{font-size:17px;font-weight:700}
    .crop-cancel,.crop-apply{background:none;color:#0a84ff;font-size:17px;padding:8px;cursor:pointer}
    .crop-apply{font-weight:600}
    .crop-stage-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:20px}
    .crop-stage{position:relative;width:min(78vw,330px);height:min(78vw,330px);overflow:hidden;border-radius:50%;background:#111;touch-action:none;box-shadow:0 0 0 1px rgba(255,255,255,.22)}
    .crop-stage:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,.58);pointer-events:none}
    #cropImage{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center center;touch-action:none}
    .crop-controls{padding:18px 22px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;gap:12px;flex-shrink:0}
    .crop-zoom{flex:1;accent-color:#fff}
    .crop-hint{text-align:center;color:#98989f;font-size:13px;padding-bottom:8px}
  `;
  document.head.appendChild(style);

  const modal = document.createElement("div");
  modal.id = "imageCropModal";
  modal.innerHTML = `
    <div class="crop-header">
      <button class="crop-cancel" id="cropCancelButton">취소</button>
      <div class="crop-title">프로필 사진 조정</div>
      <button class="crop-apply" id="cropApplyButton">적용</button>
    </div>
    <div class="crop-stage-wrap">
      <div class="crop-stage" id="cropStage"><img id="cropImage" alt=""></div>
    </div>
    <div class="crop-hint">사진을 드래그하여 위치를 조정하고 확대하세요.</div>
    <div class="crop-controls"><span>−</span><input id="cropZoom" class="crop-zoom" type="range" min="1" max="3" step="0.01" value="1"><span>＋</span></div>
  `;
  document.querySelector(".app").appendChild(modal);

  document.getElementById("cropCancelButton").onclick = closeImageCropper;
  document.getElementById("cropApplyButton").onclick = applyImageCropper;
  document.getElementById("cropZoom").oninput = e => { cropScale = Number(e.target.value); updateCropTransform(); };

  const stage = document.getElementById("cropStage");
  stage.addEventListener("pointerdown", e => {
    cropDragging = true;
    cropStartX = e.clientX; cropStartY = e.clientY;
    cropBaseX = cropX; cropBaseY = cropY;
    stage.setPointerCapture?.(e.pointerId);
  });
  stage.addEventListener("pointermove", e => {
    if(!cropDragging) return;
    cropX = cropBaseX + (e.clientX - cropStartX);
    cropY = cropBaseY + (e.clientY - cropStartY);
    updateCropTransform();
  });
  stage.addEventListener("pointerup", () => cropDragging = false);
  stage.addEventListener("pointercancel", () => cropDragging = false);
}

function openImageCropper(src, callback){
  ensureCropper();
  cropCallback = callback;
  cropScale = 1; cropX = 0; cropY = 0;
  const modal = document.getElementById("imageCropModal");
  const img = document.getElementById("cropImage");
  const zoom = document.getElementById("cropZoom");
  img.onload = () => { updateCropTransform(); };
  img.onerror = () => { closeImageCropper(); showToast("사진을 불러오지 못했습니다"); };
  img.src = src;
  zoom.value = "1";
  modal.classList.add("open");
}

function updateCropTransform(){
  const img = document.getElementById("cropImage");
  if(img) img.style.transform = `translate(${cropX}px,${cropY}px) scale(${cropScale})`;
}

function closeImageCropper(){
  const modal = document.getElementById("imageCropModal");
  if(modal) modal.classList.remove("open");
  cropCallback = null;
  cropImageElement = null;
}

function applyImageCropper(){
  const img = document.getElementById("cropImage");
  const stage = document.getElementById("cropStage");
  if(!img || !img.naturalWidth || !cropCallback) return;

  const size = 512;
  const canvas = document.createElement("canvas");
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#111"; ctx.fillRect(0,0,size,size);

  const stageSize = stage.clientWidth;
  const cover = Math.max(stageSize / img.naturalWidth, stageSize / img.naturalHeight);
  const drawScale = cover * cropScale * (size / stageSize);
  const dw = img.naturalWidth * drawScale;
  const dh = img.naturalHeight * drawScale;
  const dx = (size - dw) / 2 + cropX * (size / stageSize);
  const dy = (size - dh) / 2 + cropY * (size / stageSize);
  ctx.drawImage(img, dx, dy, dw, dh);

  const result = canvas.toDataURL("image/jpeg", .88);
  const cb = cropCallback;
  closeImageCropper();
  cb(result);
}
