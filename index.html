<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="apple-touch-icon" href="./icon.png.jpg">
<link rel="icon" type="image/jpeg" href="./icon.png.jpg">
<link rel="manifest" href="./manifest.json">
<title>메시지</title>

<style>
:root{
  --blue:#0a84ff;
  --green:#30d158;
  --red:#ff3b30;
  --orange:#ff9f0a;
  --purple:#bf5af2;
  --pink:#ff375f;
  --bg:#fff;
  --secondary:#f2f2f7;
  --tertiary:#e5e5ea;
  --text:#111;
  --sub:#8e8e93;
  --separator:rgba(60,60,67,.29);
  --bubble:#e9e9eb;
  --shadow:0 12px 40px rgba(0,0,0,.18);
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#000;
    --secondary:#1c1c1e;
    --tertiary:#2c2c2e;
    --text:#f5f5f7;
    --sub:#98989f;
    --separator:rgba(84,84,88,.65);
    --bubble:#262628;
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
  "Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  position:relative;
  width:100%;
  height:100dvh;
  max-width:430px;
  margin:auto;
  overflow:hidden;
  background:var(--bg);
  isolation:isolate;
}

body.force-dark{
  --bg:#000;
  --secondary:#1c1c1e;
  --tertiary:#2c2c2e;
  --text:#f5f5f7;
  --sub:#98989f;
  --separator:rgba(84,84,88,.65);
  --bubble:#262628;
}

body.force-light{
  --bg:#fff;
  --secondary:#f2f2f7;
  --tertiary:#e5e5ea;
  --text:#111;
  --sub:#8e8e93;
  --separator:rgba(60,60,67,.29);
  --bubble:#e9e9eb;
}

/* =========================
   공통
========================= */

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  transition:
    transform .38s cubic-bezier(.32,.72,0,1),
    opacity .2s ease;
  z-index:1;
}

.screen.off-right{
  transform:translateX(100%);
  pointer-events:none;
}

.screen.off-left{
  transform:translateX(-28%);
  pointer-events:none;
}

.screen.active{
  transform:translateX(0);
  pointer-events:auto;
}

.hidden{
  display:none!important;
}

.no-scrollbar{
  scrollbar-width:none;
}

.no-scrollbar::-webkit-scrollbar{
  display:none;
}

button{
  border:0;
  background:none;
  color:inherit;
  padding:0;
}

button:active{
  opacity:.55;
}

svg{
  display:block;
}

.safe-top{
  padding-top:env(safe-area-inset-top,0px);
}

.safe-bottom{
  padding-bottom:env(safe-area-inset-bottom,0px);
}

/* =========================
   SVG icons
========================= */

.icon{
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.icon.small{
  width:19px;
  height:19px;
}

.icon.large{
  width:27px;
  height:27px;
}

/* =========================
   목록 상단
========================= */

.list-header{
  flex-shrink:0;
  padding:
    calc(env(safe-area-inset-top,0px) + 6px)
    16px
    0;
  background:var(--bg);
  z-index:20;
}

.header-top{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-top-left,
.header-top-right{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:80px;
}

.header-top-right{
  justify-content:flex-end;
}

.edit-button{
  color:var(--blue);
  font-size:17px;
  letter-spacing:-.2px;
}

.header-icon-button{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
}

.main-title{
  margin:3px 0 11px;
  font-size:39px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1.7px;
}

.search-bar{
  height:37px;
  border-radius:10px;
  background:var(--secondary);
  color:var(--sub);
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 10px;
  margin-bottom:8px;
  font-size:16px;
}

.search-bar input{
  width:100%;
  border:0;
  outline:0;
  background:none;
  color:var(--text);
  font-size:16px;
}

.search-bar input::placeholder{
  color:var(--sub);
}

/* =========================
   사용자 프로필
========================= */

.user-profile{
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 4px 10px;
  margin-bottom:2px;
  border-bottom:0;
  position:relative;
}

.user-profile:active{
  opacity:.6;
}

.avatar{
  width:50px;
  height:50px;
  flex:0 0 50px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7b61ff,#bf5af2);
  color:#fff;
  font-size:19px;
  font-weight:700;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.user-profile-info{
  min-width:0;
  flex:1;
}

.user-profile-name{
  font-size:17px;
  font-weight:650;
  letter-spacing:-.2px;
}

.user-profile-status{
  margin-top:2px;
  font-size:14px;
  color:var(--sub);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chevron{
  color:#8e8e93;
  font-size:27px;
  font-weight:300;
  padding-right:4px;
}

/* =========================
   메시지 목록
========================= */

.message-list{
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding-bottom:
    calc(env(safe-area-inset-bottom,0px) + 82px);
}

.conversation-row{
  min-height:77px;
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:9px 16px 0 16px;
  position:relative;
  transition:background .15s;
}

.conversation-row:active{
  background:var(--secondary);
}

.row-avatar{
  width:54px;
  height:54px;
  flex:0 0 54px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#777;
  color:#fff;
  font-size:19px;
  font-weight:700;
}

.row-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.row-content{
  min-width:0;
  flex:1;
  padding:1px 0 11px;
  border-bottom:.5px solid var(--separator);
}

.row-top{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.row-name{
  min-width:0;
  flex:1;
  font-size:18px;
  line-height:22px;
  font-weight:650;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.row-time{
  flex-shrink:0;
  font-size:14px;
  color:var(--sub);
}

.row-preview-line{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:1px;
}

.row-preview{
  min-width:0;
  flex:1;
  color:var(--sub);
  font-size:15.5px;
  line-height:20px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.row-unread{
  width:9px;
  height:9px;
  flex:0 0 9px;
  background:var(--blue);
  border-radius:50%;
  margin-right:1px;
}

.row-pin{
  color:var(--sub);
  font-size:12px;
  margin-right:3px;
}

.selection-circle{
  width:23px;
  height:23px;
  flex:0 0 23px;
  border:2px solid #a7a7ac;
  border-radius:50%;
  margin-top:15px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.selection-circle.selected{
  border-color:var(--blue);
  background:var(--blue);
  color:white;
}

.selection-circle.selected:after{
  content:"✓";
  font-size:13px;
  font-weight:700;
}

.editing .conversation-row{
  padding-left:12px;
}

.editing .row-avatar{
  width:52px;
  height:52px;
  flex-basis:52px;
}

/* =========================
   하단 compose
========================= */

.list-bottom{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  pointer-events:none;
  padding:
    0
    14px
    calc(env(safe-area-inset-bottom,0px) + 10px);
  display:flex;
  justify-content:flex-end;
  align-items:flex-end;
}

.compose-button{
  width:52px;
  height:52px;
  border-radius:50%;
  background:var(--secondary);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  pointer-events:auto;
}

.compose-button .icon{
  width:27px;
  height:27px;
}

/* =========================
   편집 toolbar
========================= */

.edit-toolbar{
  display:none;
  height:45px;
  flex-shrink:0;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:.5px solid var(--separator);
}

.editing .edit-toolbar{
  display:flex;
}

.editing .normal-toolbar{
  display:none;
}

.edit-toolbar .cancel{
  color:var(--blue);
  font-size:17px;
}

.edit-toolbar .selection-title{
  font-size:16px;
  font-weight:650;
}

.edit-toolbar .select-all{
  color:var(--blue);
  font-size:16px;
}

.edit-action-bar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:50;
  display:none;
  padding:
    10px
    14px
    calc(env(safe-area-inset-bottom,0px) + 10px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-top:.5px solid var(--separator);
}

.editing.has-selection .edit-action-bar{
  display:flex;
}

.edit-actions{
  width:100%;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.edit-action{
  min-width:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  color:var(--blue);
  font-size:11px;
}

.edit-action.danger{
  color:var(--red);
}

.edit-action.disabled{
  color:var(--sub);
  opacity:.45;
}

/* =========================
   팝업 메뉴
========================= */

.popup-backdrop{
  position:absolute;
  inset:0;
  z-index:80;
  display:none;
}

.popup-backdrop.open{
  display:block;
}

.filter-popup{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 55px);
  right:10px;
  width:260px;
  padding:7px 0;
  border-radius:17px;
  background:rgba(248,248,250,.95);
  color:#111;
  box-shadow:var(--shadow);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  z-index:100;
  transform-origin:top right;
  animation:popupIn .18s cubic-bezier(.2,.8,.2,1);
}

@media(prefers-color-scheme:dark){
  .filter-popup{
    background:rgba(42,42,44,.96);
    color:#fff;
  }
}

body.force-dark .filter-popup{
  background:rgba(42,42,44,.96);
  color:#fff;
}

body.force-light .filter-popup{
  background:rgba(248,248,250,.95);
  color:#111;
}

@keyframes popupIn{
  from{opacity:0;transform:scale(.94) translateY(-4px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

.filter-popup button{
  width:100%;
  min-height:43px;
  padding:9px 17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  font-size:17px;
}

.filter-popup button .popup-check{
  color:var(--blue);
  font-size:18px;
}

.popup-label{
  padding:8px 17px 5px;
  font-size:12px;
  color:#8e8e93;
}

.popup-separator{
  height:.5px;
  background:rgba(60,60,67,.22);
  margin:4px 0;
}

/* =========================
   공통 서브 화면 nav
========================= */

.subnav{
  min-height:54px;
  flex-shrink:0;
  padding:
    calc(env(safe-area-inset-top,0px) + 3px)
    10px
    0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:.5px solid var(--separator);
}

.subnav-title{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  font-size:17px;
  font-weight:650;
  white-space:nowrap;
}

.nav-button{
  min-width:45px;
  min-height:44px;
  display:flex;
  align-items:center;
  color:var(--blue);
  font-size:17px;
  padding:0 5px;
  z-index:2;
}

.nav-button.right{
  justify-content:flex-end;
}

.nav-back{
  display:flex;
  align-items:center;
  gap:0;
}

.nav-back svg{
  width:12px;
  height:21px;
  stroke-width:2;
}

/* =========================
   필터 관리
========================= */

.settings-screen{
  background:var(--secondary);
}

.settings-scroll{
  flex:1;
  overflow-y:auto;
  padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 30px);
}

.settings-group{
  background:var(--bg);
  border-radius:14px;
  overflow:hidden;
  margin-bottom:27px;
}

.settings-row{
  min-height:53px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:9px 16px;
  border-bottom:.5px solid var(--separator);
}

.settings-row:last-child{
  border-bottom:0;
}

.settings-row-main{
  min-width:0;
  flex:1;
}

.settings-row-title{
  font-size:16px;
}

.settings-row-sub{
  font-size:12px;
  color:var(--sub);
  margin-top:2px;
}

.settings-arrow{
  color:var(--sub);
  font-size:24px;
  font-weight:300;
}

.settings-heading{
  color:var(--sub);
  font-size:13px;
  margin:0 0 8px 15px;
}

.admin-entry{
  color:var(--blue);
}

.admin-entry-icon{
  width:31px;
  height:31px;
  border-radius:8px;
  background:var(--secondary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
}

/* iOS toggle */

.toggle{
  width:51px;
  height:31px;
  border-radius:16px;
  background:#78788029;
  position:relative;
  flex:0 0 51px;
  transition:.2s;
}

.toggle:after{
  content:"";
  position:absolute;
  width:27px;
  height:27px;
  top:2px;
  left:2px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.25);
  transition:.2s;
}

.toggle.on{
  background:var(--green);
}

.toggle.on:after{
  transform:translateX(20px);
}

/* =========================
   관리자
========================= */

.admin-screen{
  background:var(--secondary);
}

.admin-scroll{
  flex:1;
  overflow-y:auto;
  padding:18px 14px calc(env(safe-area-inset-bottom,0px) + 35px);
}

.admin-section{
  background:var(--bg);
  border-radius:15px;
  overflow:hidden;
  margin-bottom:17px;
}

.admin-section-title{
  color:var(--sub);
  font-size:13px;
  padding:15px 16px 7px;
}

.character-item{
  min-height:65px;
  padding:9px 13px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:.5px solid var(--separator);
}

.character-item:last-child{
  border-bottom:0;
}

.character-item.selected{
  background:rgba(10,132,255,.07);
}

.character-avatar{
  width:43px;
  height:43px;
  flex:0 0 43px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:700;
  background:#777;
}

.character-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.character-info{
  min-width:0;
  flex:1;
}

.character-name{
  font-size:16px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.character-phone{
  color:var(--sub);
  font-size:12px;
  margin-top:2px;
}

.color-dot{
  width:19px;
  height:19px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.12);
}

.admin-detail{
  padding:16px;
}

.admin-detail-title{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.admin-detail-avatar{
  width:62px;
  height:62px;
  border-radius:50%;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:24px;
  font-weight:700;
}

.admin-detail-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.admin-detail-name{
  font-size:20px;
  font-weight:700;
}

.admin-field{
  margin-bottom:13px;
}

.admin-field label{
  display:block;
  font-size:12px;
  color:var(--sub);
  margin:0 0 6px 3px;
}

.admin-input,
.admin-textarea,
.admin-select{
  width:100%;
  border:0;
  outline:0;
  background:var(--secondary);
  color:var(--text);
  border-radius:11px;
  padding:11px 12px;
  font-size:16px;
}

.admin-textarea{
  resize:none;
  min-height:85px;
}

.color-control{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--secondary);
  border-radius:11px;
  padding:8px 11px;
}

.color-control input{
  width:50px;
  height:34px;
  border:0;
  padding:0;
  background:none;
}

.admin-button{
  min-height:43px;
  padding:0 16px;
  border-radius:11px;
  background:var(--blue);
  color:#fff;
  font-weight:600;
  font-size:15px;
}

.admin-button.secondary{
  background:var(--secondary);
  color:var(--blue);
}

.admin-button.danger{
  background:rgba(255,59,48,.1);
  color:var(--red);
}

.admin-button.full{
  width:100%;
}

.admin-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.admin-message-thread{
  max-height:270px;
  overflow-y:auto;
  background:var(--secondary);
  border-radius:11px;
}

.admin-thread-item{
  display:flex;
  align-items:flex-start;
  gap:7px;
  padding:8px 9px;
  border-bottom:.5px solid var(--separator);
  font-size:13px;
}

.admin-thread-item:last-child{
  border-bottom:0;
}

.admin-thread-who{
  width:39px;
  flex:0 0 39px;
  color:var(--blue);
  font-size:11px;
  font-weight:700;
}

.admin-thread-who.them{
  color:var(--orange);
}

.admin-thread-text{
  flex:1;
  min-width:0;
  white-space:pre-wrap;
  word-break:break-word;
}

.admin-thread-time{
  color:var(--sub);
  font-size:10px;
  white-space:nowrap;
}

.admin-thread-delete{
  color:var(--red);
  font-size:14px;
}

.empty-admin{
  padding:25px 16px;
  text-align:center;
  color:var(--sub);
  font-size:14px;
}

.add-character{
  padding:15px;
}

.add-character .admin-buttons{
  margin-top:10px;
}

/* =========================
   날짜/시간 관리자
========================= */

.datetime-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.now-button{
  margin-top:8px;
  width:100%;
  min-height:38px;
  border-radius:9px;
  background:var(--secondary);
  color:var(--blue);
  font-size:14px;
  font-weight:600;
}

/* =========================
   채팅
========================= */

.chat-screen{
  background:var(--bg);
}

.chat-nav{
  min-height:67px;
  flex-shrink:0;
  position:relative;
  padding:
    calc(env(safe-area-inset-top,0px) + 2px)
    10px
    4px;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:.5px solid var(--separator);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  z-index:30;
}

.chat-back{
  min-width:55px;
  min-height:43px;
  display:flex;
  align-items:center;
  gap:2px;
  color:var(--blue);
  font-size:17px;
  align-self:center;
}

.chat-back svg{
  width:11px;
  height:20px;
  stroke-width:2;
}

.chat-person{
  position:absolute;
  left:50%;
  bottom:4px;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:1px;
  max-width:150px;
}

.chat-person .avatar{
  width:32px;
  height:32px;
  flex-basis:32px;
  font-size:12px;
}

.chat-person-name{
  font-size:11px;
  line-height:13px;
  max-width:150px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.chat-person-arrow{
  position:absolute;
  right:-14px;
  bottom:10px;
  color:var(--sub);
  font-size:12px;
}

.chat-info-button{
  min-width:45px;
  min-height:43px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  color:var(--blue);
  align-self:center;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
  padding:9px 11px 12px;
  display:flex;
  flex-direction:column;
}

.chat-date{
  align-self:center;
  color:var(--sub);
  font-size:12px;
  font-weight:600;
  margin:12px 0 8px;
}

.message-row{
  width:100%;
  display:flex;
  margin:1px 0;
}

.message-row.them{
  justify-content:flex-start;
}

.message-row.me{
  justify-content:flex-end;
}

.message-content{
  max-width:78%;
  display:flex;
  flex-direction:column;
}

.message-row.me .message-content{
  align-items:flex-end;
}

.message-bubble{
  padding:8px 13px;
  font-size:16.5px;
  line-height:1.3;
  white-space:pre-wrap;
  word-break:break-word;
  border-radius:19px;
}

.message-row.them .message-bubble{
  color:#fff;
  background:var(--character-color,#0a84ff);
  border-bottom-left-radius:5px;
}

.message-row.me .message-bubble{
  color:#fff;
  background:var(--blue);
  border-bottom-right-radius:5px;
}

.message-row.continued .message-bubble{
  border-radius:19px;
}

.message-row.them.continued .message-bubble{
  border-bottom-left-radius:5px;
}

.message-row.them.last-group .message-bubble{
  border-bottom-left-radius:19px;
}

.message-row.me.continued .message-bubble{
  border-bottom-right-radius:5px;
}

.message-row.me.last-group .message-bubble{
  border-bottom-right-radius:19px;
}

.message-time{
  color:var(--sub);
  font-size:10px;
  margin:2px 5px 3px;
}

.chat-date + .message-row{
  margin-top:0;
}

.chat-read{
  align-self:flex-end;
  color:var(--sub);
  font-size:11px;
  margin:1px 5px 0;
}

/* =========================
   채팅 입력
========================= */

.chat-input-area{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:
    7px
    10px
    calc(env(safe-area-inset-bottom,0px) + 7px);
  background:var(--bg);
  border-top:.5px solid var(--separator);
}

.plus-button{
  width:31px;
  height:31px;
  flex:0 0 31px;
  margin-bottom:2px;
  border-radius:50%;
  border:1.5px solid var(--sub);
  color:var(--sub);
  display:flex;
  align-items:center;
  justify-content:center;
}

.plus-button svg{
  width:18px;
  height:18px;
}

.message-input-wrap{
  flex:1;
  min-height:35px;
  border:1px solid #c7c7cc;
  border-radius:19px;
  display:flex;
  align-items:flex-end;
  background:var(--bg);
  overflow:hidden;
}

.message-input{
  width:100%;
  max-height:105px;
  resize:none;
  border:0;
  outline:0;
  background:none;
  color:var(--text);
  padding:7px 11px;
  font-size:16px;
  line-height:20px;
}

.message-input::placeholder{
  color:var(--sub);
}

.send-button{
  width:31px;
  height:31px;
  flex:0 0 31px;
  margin-bottom:2px;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  opacity:.35;
  display:flex;
  align-items:center;
  justify-content:center;
}

.send-button.ready{
  opacity:1;
}

.send-button svg{
  width:17px;
  height:17px;
  stroke-width:2.3;
}

/* =========================
   연락처
========================= */

.contact-screen{
  background:var(--secondary);
}

.contact-scroll{
  flex:1;
  overflow-y:auto;
  padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 30px);
  text-align:center;
}

.contact-big-avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  margin:2px auto 12px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:38px;
  font-weight:700;
}

.contact-big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.contact-name{
  font-size:24px;
  line-height:29px;
  font-weight:700;
}

.contact-phone{
  color:var(--sub);
  font-size:14px;
  margin-top:2px;
}

.contact-actions{
  display:flex;
  justify-content:center;
  gap:27px;
  margin:23px 0 28px;
}

.contact-action{
  color:var(--blue);
  min-width:54px;
  font-size:12px;
}

.contact-action-button{
  width:54px;
  height:54px;
  margin:0 auto 5px;
  border-radius:50%;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
}

.contact-action-button svg{
  width:22px;
  height:22px;
}

.contact-card{
  background:var(--bg);
  border-radius:14px;
  text-align:left;
  overflow:hidden;
}

.contact-card-row{
  min-height:53px;
  padding:9px 15px;
  border-bottom:.5px solid var(--separator);
}

.contact-card-row:last-child{
  border-bottom:0;
}

.contact-card-label{
  color:var(--sub);
  font-size:12px;
}

.contact-card-value{
  color:var(--blue);
  font-size:16px;
  margin-top:2px;
}

/* =========================
   사용자 프로필 sheet
========================= */

.modal-overlay{
  position:absolute;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.38);
  display:none;
  align-items:flex-end;
}

.modal-overlay.open{
  display:flex;
}

.sheet{
  width:100%;
  max-height:92%;
  overflow-y:auto;
  background:var(--bg);
  border-radius:27px 27px 0 0;
  padding:
    9px
    18px
    calc(env(safe-area-inset-bottom,0px) + 26px);
  animation:sheetUp .32s cubic-bezier(.32,.72,0,1);
}

@keyframes sheetUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.grabber{
  width:39px;
  height:5px;
  border-radius:5px;
  background:#c7c7cc;
  margin:0 auto 17px;
}

.sheet-title{
  text-align:center;
  font-size:20px;
  font-weight:700;
  margin-bottom:19px;
}

.sheet-avatar{
  width:104px;
  height:104px;
  border-radius:50%;
  overflow:hidden;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#7b61ff,#bf5af2);
  color:#fff;
  font-size:35px;
  font-weight:700;
}

.sheet-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.sheet-photo-button{
  display:block;
  margin:9px auto 19px;
  color:var(--blue);
  font-size:16px;
  font-weight:600;
}

.sheet-field{
  margin-top:10px;
  padding:9px 13px;
  border-radius:14px;
  background:var(--secondary);
}

.sheet-field label{
  display:block;
  color:var(--sub);
  font-size:11px;
  margin-bottom:2px;
}

.sheet-field input{
  width:100%;
  border:0;
  outline:0;
  background:none;
  color:var(--text);
  font-size:16px;
}

.sheet-buttons{
  display:flex;
  gap:9px;
  margin-top:17px;
}

.sheet-button{
  flex:1;
  min-height:45px;
  border-radius:12px;
  background:var(--secondary);
  color:var(--blue);
  font-size:16px;
  font-weight:600;
}

.sheet-button.primary{
  background:var(--blue);
  color:#fff;
}

/* =========================
   새 메시지
========================= */

.new-message-screen{
  background:var(--bg);
}

.new-message-search{
  margin:12px 16px;
  height:39px;
  border-radius:10px;
  background:var(--secondary);
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 11px;
  color:var(--sub);
}

.new-message-search input{
  flex:1;
  border:0;
  outline:0;
  background:none;
  color:var(--text);
  font-size:16px;
}

.new-message-list{
  flex:1;
  overflow-y:auto;
}

.new-character-row{
  min-height:66px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:7px 16px;
  border-bottom:.5px solid var(--separator);
}

.new-character-row:active{
  background:var(--secondary);
}

.new-character-row .avatar{
  width:48px;
  height:48px;
  flex-basis:48px;
}

.new-character-name{
  font-size:17px;
  font-weight:600;
}

.new-character-phone{
  color:var(--sub);
  font-size:13px;
  margin-top:2px;
}

/* =========================
   최근 삭제
========================= */

.deleted-screen{
  background:var(--secondary);
}

.deleted-info{
  color:var(--sub);
  font-size:13px;
  line-height:18px;
  text-align:center;
  padding:18px 28px 12px;
}

.deleted-row{
  background:var(--bg);
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:11px;
  border-bottom:.5px solid var(--separator);
}

.deleted-row-info{
  flex:1;
  min-width:0;
}

.deleted-row-name{
  font-size:16px;
  font-weight:600;
}

.deleted-row-time{
  color:var(--sub);
  font-size:12px;
  margin-top:2px;
}

.deleted-buttons{
  display:flex;
  gap:6px;
}

.deleted-buttons button{
  padding:7px 9px;
  border-radius:8px;
  background:var(--secondary);
  color:var(--blue);
  font-size:12px;
}

/* =========================
   토스트
========================= */

.toast{
  position:absolute;
  z-index:500;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 78px);
  transform:translate(-50%,10px);
  max-width:calc(100% - 40px);
  padding:10px 15px;
  border-radius:13px;
  background:rgba(30,30,30,.9);
  color:#fff;
  font-size:14px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =========================
   작은 화면
========================= */

@media(max-width:360px){
  .main-title{
    font-size:36px;
  }

  .message-bubble{
    font-size:16px;
  }

  .conversation-row{
    padding-right:11px;
  }
}
</style>
</head>

<body>
<div class="app" id="app">

  <!-- ================= 목록 ================= -->
  <section class="screen active" id="listScreen">

    <header class="list-header">
      <div class="normal-toolbar">
        <div class="header-top">
          <div class="header-top-left">
            <button class="edit-button" id="editButton">편집</button>
          </div>

          <div class="header-top-right">
            <button class="header-icon-button" id="filterButton" aria-label="필터">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M4 6h16M7 12h10M10 18h4"/>
              </svg>
            </button>

            <button class="header-icon-button" id="newMessageButton" aria-label="새 메시지">
              <svg class="icon" viewBox="0 0 24 24">
                <path d="M4 20l1.8-5.8L15.7 4.3a2.1 2.1 0 0 1 3 3l-9.9 9.9L4 20z"/>
                <path d="M13.8 6.2l4 4"/>
              </svg>
            </button>
          </div>
        </div>

        <h1 class="main-title">메시지</h1>

        <div class="search-bar">
          <svg class="icon small" viewBox="0 0 24 24">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="M16 16l5 5"/>
          </svg>
          <input id="conversationSearch" placeholder="검색">
        </div>

        <div class="user-profile" id="userProfileButton">
          <div class="avatar" id="listUserAvatar"></div>
          <div class="user-profile-info">
            <div class="user-profile-name" id="listUserName"></div>
            <div class="user-profile-status" id="listUserStatus"></div>
          </div>
          <div class="chevron">›</div>
        </div>
      </div>

      <div class="edit-toolbar">
        <button class="cancel" id="cancelEditButton">취소</button>
        <div class="selection-title">메시지 선택</div>
        <button class="select-all" id="selectAllButton">모두 선택</button>
      </div>
    </header>

    <div class="message-list no-scrollbar" id="messageList"></div>

    <div class="list-bottom">
      <button class="compose-button" id="bottomComposeButton" aria-label="새 메시지">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M4 20l1.8-5.8L15.7 4.3a2.1 2.1 0 0 1 3 3l-9.9 9.9L4 20z"/>
          <path d="M13.8 6.2l4 4"/>
        </svg>
      </button>
    </div>

    <div class="edit-action-bar">
      <div class="edit-actions">
        <button class="edit-action" id="markReadAction">
          <svg class="icon small" viewBox="0 0 24 24">
            <path d="M3 12.5l5 5L21 5"/>
          </svg>
          <span>읽음</span>
        </button>

        <button class="edit-action" id="markUnreadAction">
          <svg class="icon small" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="8"/>
          </svg>
          <span>읽지 않음</span>
        </button>

        <button class="edit-action" id="pinAction">
          <svg class="icon small" viewBox="0 0 24 24">
            <path d="M8 4h8l-1 7 3 3H6l3-3-1-7z"/>
            <path d="M12 14v6"/>
          </svg>
          <span>고정</span>
        </button>

        <button class="edit-action danger" id="deleteAction">
          <svg class="icon small" viewBox="0 0 24 24">
            <path d="M4 7h16"/>
            <path d="M9 7V4h6v3M7 7l1 14h8l1-14"/>
          </svg>
          <span>삭제</span>
        </button>
      </div>
    </div>

    <div class="popup-backdrop" id="popupBackdrop"></div>

    <div class="filter-popup hidden" id="filterPopup">
      <button data-filter="all">
        <span>메시지</span>
        <span class="popup-check" id="checkAll">✓</span>
      </button>

      <button data-filter="spam">
        <span>스팸</span>
        <span class="popup-check hidden" id="checkSpam">✓</span>
      </button>

      <button data-filter="deleted">
        <span>최근 삭제된 항목</span>
      </button>

      <div class="popup-separator"></div>

      <div class="popup-label">필터 기준</div>

      <button data-filter="unread">
        <span>● 읽지 않음</span>
        <span class="popup-check hidden" id="checkUnread">✓</span>
      </button>

      <div class="popup-separator"></div>

      <button id="filterSettingsButton">
        <span>필터링 관리</span>
        <span style="color:#8e8e93;font-size:23px">›</span>
      </button>
    </div>
  </section>

  <!-- ================= 필터링 관리 ================= -->
  <section class="screen off-right" id="settingsScreen">

    <header class="subnav">
      <button class="nav-button nav-back" id="settingsBackButton">
        <svg viewBox="0 0 12 22" fill="none">
          <path d="M10 1L2 11l8 10"/>
        </svg>
        <span>메시지</span>
      </button>

      <div class="subnav-title">필터링 관리</div>

      <div style="width:55px"></div>
    </header>

    <div class="settings-scroll no-scrollbar">

      <div class="settings-heading">메시지 필터링</div>

      <div class="settings-group">

        <div class="settings-row">
          <div class="settings-row-main">
            <div class="settings-row-title">스팸 필터링</div>
            <div class="settings-row-sub">스팸으로 지정된 대화를 별도로 표시합니다.</div>
          </div>
          <button class="toggle" id="spamFilterToggle"></button>
        </div>

        <div class="settings-row">
          <div class="settings-row-main">
            <div class="settings-row-title">알 수 없는 발신자 필터링</div>
            <div class="settings-row-sub">저장되지 않은 발신자의 메시지를 분리합니다.</div>
          </div>
          <button class="toggle" id="unknownFilterToggle"></button>
        </div>

        <div class="settings-row">
          <div class="settings-row-main">
            <div class="settings-row-title">문자 메시지 필터링</div>
            <div class="settings-row-sub">문자 메시지를 별도 필터로 관리합니다.</div>
          </div>
          <button class="toggle" id="smsFilterToggle"></button>
        </div>

      </div>

      <div class="settings-heading">관리</div>

      <div class="settings-group">
        <button class="settings-row admin-entry" id="adminEntryButton">
          <div class="admin-entry-icon">⚙️</div>
          <div class="settings-row-main">
            <div class="settings-row-title">관리자 · 캐릭터 설정</div>
            <div class="settings-row-sub">캐릭터, 프로필, 말풍선, 대화를 관리합니다.</div>
          </div>
          <div class="settings-arrow">›</div>
        </button>
      </div>

      <div class="settings-heading">화면</div>

      <div class="settings-group">
        <div class="settings-row">
          <div class="settings-row-main">
            <div class="settings-row-title">다크 모드</div>
          </div>
          <button class="toggle" id="darkModeToggle"></button>
        </div>
      </div>

    </div>
  </section>

  <!-- ================= 관리자 ================= -->
  <section class="screen off-right admin-screen" id="adminScreen">

    <header class="subnav">
      <button class="nav-button nav-back" id="adminBackButton">
        <svg viewBox="0 0 12 22" fill="none">
          <path d="M10 1L2 11l8 10"/>
        </svg>
        <span>필터링 관리</span>
      </button>

      <div class="subnav-title">캐릭터 설정</div>

      <button class="nav-button right" id="adminAddTopButton">추가</button>
    </header>

    <div class="admin-scroll no-scrollbar">

      <div class="admin-section">
        <div class="admin-section-title">캐릭터</div>
        <div id="characterList"></div>

        <div class="add-character">
          <button class="admin-button secondary full" id="showAddCharacterButton">
            + 캐릭터 추가
          </button>

          <div id="addCharacterForm" class="hidden">
            <div class="admin-field">
              <label>이름</label>
              <input class="admin-input" id="newCharName" placeholder="캐릭터 이름">
            </div>

            <div class="admin-field">
              <label>전화번호</label>
              <input class="admin-input" id="newCharPhone" placeholder="010-0000-0000">
            </div>

            <div class="admin-buttons">
              <button class="admin-button" id="addCharacterConfirm">추가</button>
              <button class="admin-button secondary" id="addCharacterCancel">취소</button>
            </div>
          </div>
        </div>
      </div>

      <div id="adminDetailArea"></div>

    </div>
  </section>

  <!-- ================= 새 메시지 ================= -->
  <section class="screen off-right new-message-screen" id="newMessageScreen">

    <header class="subnav">
      <button class="nav-button" id="newMessageCancel">취소</button>
      <div class="subnav-title">새 메시지</div>
      <div style="width:55px"></div>
    </header>

    <div class="new-message-search">
      <svg class="icon small" viewBox="0 0 24 24">
        <circle cx="10.8" cy="10.8" r="6.8"/>
        <path d="M16 16l5 5"/>
      </svg>
      <input id="newCharacterSearch" placeholder="받는 사람">
    </div>

    <div class="new-message-list no-scrollbar" id="newCharacterList"></div>

<script>
/* =========================================================
   데이터 / 호환성
========================================================= */

const STORAGE = "messenger-demo-state-v3";
const LEGACY_KEYS = [
  "messenger-demo-state-v3",
  "messenger-state",
  "messengerState",
  "messages-state",
  "messenger-demo-state"
];

const DEFAULT_COLORS = [
  "#0a84ff",
  "#30d158",
  "#ff9f0a",
  "#bf5af2",
  "#ff375f",
  "#64d2ff",
  "#ffd60a"
];

let state = loadState();

let currentScreen = "listScreen";
let currentCharacterId = null;
let currentFilter = "all";
let editing = false;
let selectedIds = new Set();
let profileTempPhoto = null;
let toastTimer = null;

/* =========================================================
   기본 데이터
========================================================= */

function seedState(){

  return {
    characters:[
      {
        id:"c1",

      {

        name:"민준",

        photo:"",
        active:true,
        spam:false,
        bubbleColor:"#30d158"
      },
      {
        id:"c3",
        name:"스터디 조교 김쌤",
        phone:"010-1120-8834",
        photo:"",
        active:true,
        spam:false,
        bubbleColor:"#bf5af2"
      }
    ],

    messages:[
      {
        id:"m1",
        characterId:"c1",
        sender:"them",
        text:"안녕! 오늘 뭐 하고 있어?",
        timestamp:now - 1000*60*80,
        read:false
      },
      {

        sender:"me",
        text:"나 지금 집이야 ㅋㅋ",
        timestamp:now - 1000*60*72,
        read:true
      },
      {
        id:"m3",
        characterId:"c1",
        sender:"them",
        text:"오 나도 집에서 쉬는 중이야",
        timestamp:now - 1000*60*65,
        read:true
      },

      {
        id:"m4",
        characterId:"c2",
        sender:"them",
        text:"내일 시간 돼?",
        timestamp:now - 1000*60*190,
        read:false
      },

      {
        id:"m5",
        characterId:"c3",
        sender:"them",
        text:"과제 제출 일정 확인해주세요.",
        timestamp:now - 1000*60*60*25,
        read:true
      }
    ],

    deleted:[],

    conversationMeta:{},

    profile:{
      name:"양예서",
      status:"이름 및 사진 공유",
      photo:""
    },

    filters:{
      spam:true,
      unknown:true,
      sms:true
    },

    darkMode:null
  };
}

/* =========================================================
   상태 로드 / Migration
========================================================= */

function loadState(){
  let raw = null;

  for(const key of LEGACY_KEYS){
    try{
      const value = localStorage.getItem(key);
      if(value){
        raw = JSON.parse(value);
        if(raw) break;
      }
    }catch(e){}
  }

  if(!raw){
    const fresh = seedState();
    localStorage.setItem(STORAGE,JSON.stringify(fresh));
    return fresh;
  }

  const base = seedState();

  const merged = {
    ...base,
    ...raw,
    characters:Array.isArray(raw.characters) ? raw.characters : base.characters,
    messages:Array.isArray(raw.messages) ? raw.messages : base.messages,
    deleted:Array.isArray(raw.deleted) ? raw.deleted : [],
    conversationMeta:raw.conversationMeta || {},
    profile:{
      ...base.profile,
      ...(raw.profile || {})
    },
    filters:{
      ...base.filters,
      ...(raw.filters || {})
    }
  };

  merged.characters = merged.characters.map((c,i)=>({
    ...c,
    id:c.id || ("c"+Date.now()+i),
    name:c.name || "새로운 사람",
    phone:c.phone || "",
    photo:c.photo || "",
    active:c.active !== false,
    spam:c.spam === true,
    bubbleColor:c.bubbleColor || DEFAULT_COLORS[i % DEFAULT_COLORS.length]
  }));

  merged.messages = merged.messages.map((m,i)=>({
    ...m,
    id:m.id || ("m"+Date.now()+i),
    characterId:m.characterId || m.character || m.senderId || "",
    sender:
      m.sender === "me" ||
      m.sender === "user" ||
      m.from === "me" ? "me" : "them",
    text:String(m.text ?? m.message ?? ""),
    timestamp:normalizeTimestamp(m.timestamp ?? m.time ?? m.date),
    read:m.read !== false,
    deleted:m.deleted === true
  }));

  merged.deleted = merged.deleted.map(item=>{
    if(typeof item === "string"){
      return {
        characterId:item,
        deletedAt:Date.now()
      };
    }

    return {
      characterId:item.characterId || item.id,
      deletedAt:item.deletedAt || Date.now()
    };
  });

  saveState();
  return merged;
}

function normalizeTimestamp(value){
  if(typeof value === "number"){
    return value < 100000000000 ? value * 1000 : value;
  }

  const n = Date.parse(value);
  return Number.isFinite(n) ? n : Date.now();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE,JSON.stringify(state));
  }catch(e){
    showToast("저장 공간이 부족합니다.");
  }
}

/* =========================================================
   Utility
========================================================= */

function uid(prefix="id"){
  return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}

function getCharacter(id){
  return state.characters.find(c=>c.id===id);
}

function getMessages(characterId){
  return state.messages
    .filter(m=>m.characterId===characterId && !m.deleted)
    .sort((a,b)=>a.timestamp-b.timestamp);
}

function isDeleted(characterId){
  return state.deleted.some(d=>d.characterId===characterId);
}

function getMeta(id){
  if(!state.conversationMeta[id]){
    state.conversationMeta[id]={
      pinned:false
    };
  }

  return state.conversationMeta[id];
}

function isPinned(id){
  return !!getMeta(id).pinned;
}

function setPinned(id,value){
  getMeta(id).pinned=!!value;
  saveState();
}

function isUnread(id){
  return getMessages(id).some(m=>m.sender==="them" && !m.read);
}

function lastMessage(id){
  const msgs=getMessages(id);
  return msgs[msgs.length-1] || null;
}

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function formatListTime(timestamp){
  const date=new Date(timestamp);
  const now=new Date();

  if(
    date.getFullYear()===now.getFullYear() &&
    date.getMonth()===now.getMonth() &&
    date.getDate()===now.getDate()
  ){
    return formatTime(timestamp);
  }

  if(
    date.getFullYear()===now.getFullYear()
  ){
    return `${date.getMonth()+1}.${date.getDate()}`;
  }

  return `${date.getFullYear()}.${date.getMonth()+1}.${date.getDate()}`;
}

function formatTime(timestamp){
  const d=new Date(timestamp);
  const h=d.getHours();
  const ap=h<12 ? "오전" : "오후";
  const hour=h%12 || 12;

  return `${ap} ${hour}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function formatDateLong(timestamp){
  const d=new Date(timestamp);
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}

function dateKey(timestamp){
  const d=new Date(timestamp);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function scrollToBottom(element){
  requestAnimationFrame(()=>{
    element.scrollTop=element.scrollHeight;
  });
}

function showToast(text){
  const toast=document.getElementById("toast");
  toast.textContent=text;
  toast.classList.add("show");

  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}

function avatarHTML(person, className="avatar"){
  const initial=(person?.name || "?").trim().charAt(0) || "?";

  if(person?.photo){
    return `
      <div class="${className}">
        <img src="${person.photo}" alt="">
      </div>
    `;
  }

  return `
    <div class="${className}">
      ${escapeHTML(initial)}
    </div>
  `;
}

function setAvatarElement(element, person){
  if(!element || !person) return;

  const initial=(person.name || "?").trim().charAt(0) || "?";

  if(person.photo){
    element.innerHTML=`<img src="${person.photo}" alt="">`;
  }else{
    element.innerHTML=escapeHTML(initial);
  }
}

function readImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>resolve(reader.result);
    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}

/* =========================================================
   Screen navigation
========================================================= */

function showScreen(id,fromId=currentScreen){
  if(id===fromId) return;

  const from=document.getElementById(fromId);
  const to=document.getElementById(id);

  if(!to) return;

  if(from){
    from.classList.remove("active");
    from.classList.add("off-left");
  }

  to.classList.remove("off-right","off-left");
  to.classList.add("active");

  currentScreen=id;
}

function returnToList(){
  const screens=document.querySelectorAll(".screen");

  screens.forEach(s=>{
    s.classList.remove("active","off-left");
    s.classList.add("off-right");
  });

  document.getElementById("listScreen").classList.remove("off-right");
  document.getElementById("listScreen").classList.add("active");

  currentScreen="listScreen";

  renderList();
}

/* =========================================================
   목록 필터
========================================================= */

function getVisibleCharacters(){
  let chars=state.characters.filter(c=>c.active !== false);

  if(currentFilter==="spam"){
    chars=chars.filter(c=>c.spam);
  }else if(currentFilter==="unread"){
    chars=chars.filter(c=>!c.spam && !isDeleted(c.id) && isUnread(c.id));
  }else{
    chars=chars.filter(c=>!c.spam && !isDeleted(c.id));
  }

  if(state.filters.unknown===true){
    // 캐릭터 데이터 기반 프로토타입이므로 캐릭터는 알려진 발신자로 취급
  }

  const query=document.getElementById("conversationSearch")?.value
    .trim()
    .toLowerCase();

  if(query){
    chars=chars.filter(c=>{
      const last=lastMessage(c.id);
      return (
        c.name.toLowerCase().includes(query) ||
        c.phone.toLowerCase().includes(query) ||
        (last?.text || "").toLowerCase().includes(query)
      );
    });
  }

  chars.sort((a,b)=>{
    const pinA=isPinned(a.id);
    const pinB=isPinned(b.id);

    if(pinA!==pinB) return pinA ? -1 : 1;

    const ta=lastMessage(a.id)?.timestamp || 0;
    const tb=lastMessage(b.id)?.timestamp || 0;

    return tb-ta;
  });

  return chars;
}

function renderList(){
  const list=document.getElementById("messageList");
  if(!list) return;

  const chars=getVisibleCharacters();

  if(chars.length===0){
    let text="메시지가 없습니다.";

    if(currentFilter==="spam"){
      text="스팸으로 지정된 대화가 없습니다.";
    }else if(currentFilter==="unread"){
      text="읽지 않은 메시지가 없습니다.";
    }

    list.innerHTML=`
      <div style="
        padding:65px 25px;
        text-align:center;
        color:var(--sub);
        font-size:15px;
      ">${text}</div>
    `;

    updateFilterChecks();
    return;
  }

  list.innerHTML=chars.map(character=>{
    const last=lastMessage(character.id);
    const unread=isUnread(character.id);
    const selected=selectedIds.has(character.id);

    return `
      <div
        class="conversation-row ${selected ? "selected":""}"
        data-id="${escapeHTML(character.id)}"
      >
        ${editing ? `
          <button
            class="selection-circle ${selected ? "selected":""}"
            data-select="${escapeHTML(character.id)}"
            aria-label="선택"
          ></button>
        ` : ""}

        ${avatarHTML(character,"row-avatar")}

        <div class="row-content">
          <div class="row-top">
            <div class="row-name">${escapeHTML(character.name)}</div>

            ${isPinned(character.id) ? `
              <span class="row-pin">📌</span>
            ` : ""}

            <div class="row-time">
              ${last ? escapeHTML(formatListTime(last.timestamp)) : ""}
            </div>
          </div>

          <div class="row-preview-line">
            <div class="row-preview">
              ${last ? escapeHTML(last.text) : "새로운 대화를 시작해보세요."}
            </div>

            ${unread ? `<div class="row-unread"></div>` : ""}
          </div>
        </div>
      </div>
    `;
  }).join("");

  updateFilterChecks();
  updateEditState();
}

/* =========================================================
   목록 클릭
========================================================= */

document.getElementById("messageList").addEventListener("click",e=>{
  const select=e.target.closest("[data-select]");

  if(select){
    const id=select.dataset.select;

    if(selectedIds.has(id)){
      selectedIds.delete(id);
    }else{
      selectedIds.add(id);
    }

    renderList();
    return;
  }

  const row=e.target.closest(".conversation-row");

  if(!row) return;

  const id=row.dataset.id;

  if(editing){
    if(selectedIds.has(id)){
      selectedIds.delete(id);
    }else{
      selectedIds.add(id);
    }

    renderList();
    return;
  }

  openChat(id);
});

/* =========================================================
   편집
========================================================= */

function enterEditMode(){
  editing=true;
  selectedIds.clear();

  document.getElementById("listScreen").classList.add("editing");

  renderList();
}

function exitEditMode(){
  editing=false;
  selectedIds.clear();

  document.getElementById("listScreen").classList.remove(
    "editing",
    "has-selection"
  );

  renderList();
}

function updateEditState(){
  const listScreen=document.getElementById("listScreen");

  listScreen.classList.toggle(
    "has-selection",
    selectedIds.size>0
  );

  const all=getVisibleCharacters();

  const selectAll=document.getElementById("selectAllButton");

  if(all.length && selectedIds.size===all.length){
    selectAll.textContent="선택 해제";
  }else{
    selectAll.textContent="모두 선택";
  }
}

document.getElementById("editButton").addEventListener("click",enterEditMode);

document.getElementById("cancelEditButton").addEventListener("click",exitEditMode);

document.getElementById("selectAllButton").addEventListener("click",()=>{
  const ids=getVisibleCharacters().map(c=>c.id);

  if(ids.length && ids.every(id=>selectedIds.has(id))){
    selectedIds.clear();
  }else{
    ids.forEach(id=>selectedIds.add(id));
  }

  renderList();
});

function selectedCharacters(){
  return [...selectedIds]
    .map(id=>getCharacter(id))
    .filter(Boolean);
}

document.getElementById("markReadAction").addEventListener("click",()=>{
  selectedCharacters().forEach(c=>{
    state.messages.forEach(m=>{
      if(m.characterId===c.id && m.sender==="them"){
        m.read=true;
      }
    });
  });

  saveState();
  showToast("읽음으로 표시했습니다.");
  exitEditMode();
});

document.getElementById("markUnreadAction").addEventListener("click",()=>{
  selectedCharacters().forEach(c=>{
    const msgs=getMessages(c.id).filter(m=>m.sender==="them");

    if(msgs.length){
      msgs[msgs.length-1].read=false;
    }
  });

  saveState();
  showToast("읽지 않음으로 표시했습니다.");
  exitEditMode();
});

document.getElementById("pinAction").addEventListener("click",()=>{
  const chars=selectedCharacters();

  if(chars.length){
    const shouldPin=chars.some(c=>!isPinned(c.id));

    chars.forEach(c=>setPinned(c.id,shouldPin));

    showToast(
      shouldPin ? "대화를 고정했습니다." : "고정을 해제했습니다."
    );
  }

  exitEditMode();
});

document.getElementById("deleteAction").addEventListener("click",()=>{
  const chars=selectedCharacters();

  if(!chars.length) return;

  chars.forEach(c=>{
    if(!isDeleted(c.id)){
      state.deleted.push({
        characterId:c.id,
        deletedAt:Date.now()
      });
    }
  });

  saveState();

  showToast("최근 삭제된 항목으로 이동했습니다.");
  exitEditMode();
});

/* =========================================================
   필터 팝업
========================================================= */

function closeFilterPopup(){
  document.getElementById("filterPopup").classList.add("hidden");

}

function openFilterPopup(){
  document.getElementById("filterPopup").classList.remove("hidden");
  document.getElementById("popupBackdrop").classList.add("open");
  updateFilterChecks();
}

document.getElementById("filterButton").addEventListener("click",e=>{
  e.stopPropagation();

  const popup=document.getElementById("filterPopup");

  if(popup.classList.contains("hidden")){
    openFilterPopup();
  }else{
    closeFilterPopup();
  }
});

document.getElementById("popupBackdrop").addEventListener("click",closeFilterPopup);

document.getElementById("filterPopup").addEventListener("click",e=>{
  e.stopPropagation();

  const button=e.target.closest("[data-filter]");

  if(!button) return;

  const filter=button.dataset.filter;

  if(filter==="deleted"){
    closeFilterPopup();
    openDeleted();
    return;
  }

  currentFilter=filter;
  closeFilterPopup();
  renderList();
});

function updateFilterChecks(){
  const all=document.getElementById("checkAll");
  const spam=document.getElementById("checkSpam");
  const unread=document.getElementById("checkUnread");

  all.classList.toggle("hidden",currentFilter!=="all");
  spam.classList.toggle("hidden",currentFilter!=="spam");
  unread.classList.toggle("hidden",currentFilter!=="unread");
}

function openChat(characterId){
  const character=getCharacter(characterId);

  if(!character) return;

  currentCharacterId=characterId;

  state.messages.forEach(m=>{
    if(m.characterId===characterId && m.sender==="them"){
      m.read=true;
    }
  });

  saveState();

  renderChat();

  showScreen("chatScreen");

  requestAnimationFrame(()=>{
    scrollToBottom(document.getElementById("chatMessages"));
  });
}

function renderChat(){
  const character=getCharacter(currentCharacterId);

  if(!character) return;

  setAvatarElement(
    document.getElementById("chatAvatar"),
    character
  );

  document.getElementById("chatPersonName").textContent=character.name;

  renderChatMessages();
}

function renderChatMessages(){
  const container=document.getElementById("chatMessages");

  const messages=getMessages(currentCharacterId);

  if(!messages.length){
    container.innerHTML=`
      <div style="
        margin:auto;
        color:var(--sub);
        font-size:14px;
        text-align:center;
        padding:30px;
      ">
        새로운 대화를 시작해보세요.
      </div>
    `;
    return;
  }

  let html="";
  let previousDate=null;

  messages.forEach((message,index)=>{
    const previous=messages[index-1];
    const next=messages[index+1];

    const key=dateKey(message.timestamp);

    if(key!==previousDate){
      html+=`
        <div class="chat-date">
          ${escapeHTML(formatDateLong(message.timestamp))}
        </div>
      `;

      previousDate=key;
    }

    const continued=previous &&
      previous.sender===message.sender &&
      dateKey(previous.timestamp)===key &&
      message.timestamp-previous.timestamp < 5*60*1000;

    const lastGroup=!next ||
      next.sender!==message.sender ||
      dateKey(next.timestamp)!==key ||
      next.timestamp-message.timestamp >= 5*60*1000;

    const color=message.sender==="them"
      ? (getCharacter(currentCharacterId)?.bubbleColor || "#0a84ff")
      : "#0a84ff";

    html+=`
      <div class="
        message-row
        ${message.sender}
        ${continued ? "continued":""}
        ${lastGroup ? "last-group":""}
      "
      style="--character-color:${escapeHTML(color)}">

        <div class="message-content">

          <div class="message-bubble">
            ${escapeHTML(message.text)}
          </div>

          ${lastGroup ? `
            <div class="message-time">
              ${escapeHTML(formatTime(message.timestamp))}
            </div>
          ` : ""}

        </div>
      </div>
    `;
  });

  const last=messages[messages.length-1];

  if(last && last.sender==="me"){
    html+=`<div class="chat-read">전달됨</div>`;
  }

  container.innerHTML=html;
}

/* 다크모드 */

function applyDarkMode(){
  const preference=state.darkMode;

  document.body.classList.remove("force-dark","force-light");

  if(preference==="dark"){
    document.body.classList.add("force-dark");
  }else if(preference==="light"){
    document.body.classList.add("force-light");
  }
}

function isDarkMode(){
  if(state.darkMode==="dark") return true;
  if(state.darkMode==="light") return false;

  return window.matchMedia &&
    window.matchMedia("(prefers-color-scheme:dark)").matches;
}

function renderDarkModeToggle(){
  setToggle(
    document.getElementById("darkModeToggle"),
    isDarkMode()
  );
}

document.getElementById("darkModeToggle").addEventListener("click",()=>{
  state.darkMode=isDarkMode() ? "light" : "dark";

  applyDarkMode();
  saveState();
  renderDarkModeToggle();
});

function formatDateTimeCompact(timestamp){
  const d=new Date(timestamp);

  return `${d.getMonth()+1}/${d.getDate()} ${formatTime(timestamp)}`;
}

function setAdminDefaultDateTime(){
  const date=document.getElementById("adminMessageDate");
  const time=document.getElementById("adminMessageTime");

  if(!date || !time) return;

  const d=new Date();

  date.value=
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

  time.value=
    `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

document.getElementById("characterList").addEventListener("click",e=>{
  const row=e.target.closest("[data-admin-character]");

  if(!row) return;

  currentCharacterId=row.dataset.adminCharacter;

  renderAdmin();
});

document.getElementById("adminDetailArea").addEventListener("click",async e=>{
  const deleteMessage=e.target.closest("[data-delete-message]");

  if(deleteMessage){
    const id=deleteMessage.dataset.deleteMessage;

    state.messages=state.messages.filter(m=>m.id!==id);
    saveState();

    renderAdmin();
    showToast("메시지를 삭제했습니다.");
    return;
  }

  if(e.target.closest("#adminPhotoButton")){
    document.getElementById("adminPhotoInput")?.click();
    return;
  }

  if(e.target.closest("#saveCharacterButton")){
    const c=getCharacter(currentCharacterId);

    if(!c) return;

    c.name=
      document.getElementById("adminName").value.trim() ||
      "새로운 사람";

    c.phone=
      document.getElementById("adminPhone").value.trim();

    c.bubbleColor=
      document.getElementById("adminBubbleColor").value ||
      "#0a84ff";

    saveState();

    renderAdmin();
    renderList();

    if(currentScreen==="chatScreen"){
      renderChat();
    }

    showToast("캐릭터 설정을 저장했습니다.");
    return;
  }

  if(e.target.closest("#spamCharacterButton")){
    const c=getCharacter(currentCharacterId);

    if(!c) return;

    c.spam=!c.spam;

    saveState();
    renderAdmin();
    renderList();

    showToast(c.spam ? "스팸으로 이동했습니다.":"스팸에서 복구했습니다.");
    return;
  }

  if(e.target.closest("#deleteCharacterButton")){
    const c=getCharacter(currentCharacterId);

    if(!c) return;

    if(!confirm(`"${c.name}" 캐릭터를 삭제할까요?\n대화는 최근 삭제된 항목으로 이동됩니다.`)){
      return;
    }

    state.deleted.push({
      characterId:c.id,
      deletedAt:Date.now()
    });

    c.active=false;

    saveState();

    currentCharacterId=null;
    renderAdmin();
    renderList();

    showToast("캐릭터를 삭제했습니다.");
    return;
  }

  if(e.target.closest("#adminNowButton")){
    setAdminDefaultDateTime();
    return;
  }

  if(e.target.closest("#adminSendMessageButton")){
    sendAdminMessage();
  }
});

document.getElementById("adminDetailArea").addEventListener("change",async e=>{
  if(e.target.id==="adminPhotoInput"){
    const file=e.target.files?.[0];

    if(!file) return;

    const c=getCharacter(currentCharacterId);

    if(!c) return;

    try{
      c.photo=await readImage(file);
      saveState();
      renderAdmin();
      renderList();

      if(currentCharacterId){
        renderChat();
      }

      showToast("프로필 사진을 변경했습니다.");
    }catch{
      showToast("사진을 불러오지 못했습니다.");
    }
  }
});

document.getElementById("adminDetailArea").addEventListener("keydown",e=>{
  if(
    e.target.id==="adminMessageText" &&
    e.key==="Enter" &&
    !e.shiftKey
  ){
    e.preventDefault();
    sendAdminMessage();
  }
});

function sendAdminMessage(){
  const character=getCharacter(currentCharacterId);

  if(!character) return;

  const text=document.getElementById("adminMessageText")?.value.trim();
  const date=document.getElementById("adminMessageDate")?.value;
  const time=document.getElementById("adminMessageTime")?.value;

  if(!text){
    showToast("메시지를 입력하세요.");
    return;
  }

  if(!date || !time){
    showToast("날짜와 시간을 입력하세요.");
    return;
  }

  const timestamp=Date.parse(`${date}T${time}`);

  if(!Number.isFinite(timestamp)){
    showToast("날짜 또는 시간이 올바르지 않습니다.");
    return;
  }

  state.messages.push({
    id:uid("m"),
    characterId:character.id,
    sender:"them",
    text,
    timestamp,
    read:false
  });

  character.active=true;

  saveState();

  document.getElementById("adminMessageText").value="";

  renderAdmin();
  renderList();

  showToast(`${character.name}의 메시지를 추가했습니다.`);
}

function showAddForm(){
  document.getElementById("addCharacterForm").classList.remove("hidden");
  document.getElementById("showAddCharacterButton").classList.add("hidden");
  document.getElementById("newCharName").focus();
}

function hideAddForm(){
  document.getElementById("addCharacterForm").classList.add("hidden");
  document.getElementById("showAddCharacterButton").classList.remove("hidden");

  document.getElementById("newCharName").value="";
  document.getElementById("newCharPhone").value="";
}

document.getElementById("showAddCharacterButton").addEventListener("click",showAddForm);
document.getElementById("adminAddTopButton").addEventListener("click",showAddForm);
document.getElementById("addCharacterCancel").addEventListener("click",hideAddForm);

document.getElementById("addCharacterConfirm").addEventListener("click",()=>{
  const name=document.getElementById("newCharName").value.trim();
  const phone=document.getElementById("newCharPhone").value.trim();

  if(!name){
    showToast("캐릭터 이름을 입력하세요.");
    return;
  }

  const character={
    id:uid("c"),
    name,
    phone,
    photo:"",
    active:true,
    spam:false,
    bubbleColor:DEFAULT_COLORS[
      state.characters.length % DEFAULT_COLORS.length
    ]
  };

  state.characters.push(character);
  state.conversationMeta[character.id]={
    pinned:false
  };

  currentCharacterId=character.id;

  saveState();

  hideAddForm();
  renderAdmin();
  renderList();

  showToast("캐릭터를 추가했습니다.");
});

/* =========================================================
   최근 삭제
========================================================= */

function openDeleted(){
  renderDeleted();
  showScreen("deletedScreen");
}

function renderDeleted(){
  const list=document.getElementById("deletedList");

  const deleted=state.deleted.slice().sort(
    (a,b)=>(b.deletedAt||0)-(a.deletedAt||0)
  );

  if(!deleted.length){
    list.innerHTML=`
      <div style="
        padding:65px 25px;
        text-align:center;
        color:var(--sub);
        font-size:15px;
      ">
        최근 삭제된 대화가 없습니다.
      </div>
    `;
    return;
  }

  list.innerHTML=deleted.map(item=>{
    const c=getCharacter(item.characterId);

    if(!c) return "";

    return `
      <div class="deleted-row">

        ${avatarHTML(c,"row-avatar")}

        <div class="deleted-row-info">
          <div class="deleted-row-name">${escapeHTML(c.name)}</div>
          <div class="deleted-row-time">
            삭제됨 · ${escapeHTML(formatDateTimeCompact(item.deletedAt))}
          </div>
        </div>

        <div class="deleted-buttons">
          <button data-restore="${escapeHTML(c.id)}">
            복구
          </button>

          <button data-permanent="${escapeHTML(c.id)}">
            삭제
          </button>
        </div>
      </div>
    `;
  }).join("");
}

document.getElementById("deletedList").addEventListener("click",e=>{
  const restore=e.target.closest("[data-restore]");
  const permanent=e.target.closest("[data-permanent]");

  if(restore){
    const id=restore.dataset.restore;
    const c=getCharacter(id);

    state.deleted=state.deleted.filter(d=>d.characterId!==id);

    if(c){
      c.active=true;
    }

    saveState();

    renderDeleted();
    renderList();

    showToast("대화를 복구했습니다.");
    return;
  }

  if(permanent){
    const id=permanent.dataset.permanent;
    const c=getCharacter(id);

    if(!confirm(
      `"${c?.name || "이 대화"}"를 영구적으로 삭제할까요?\n이 작업은 되돌릴 수 없습니다.`
    )){
      return;
    }

    state.deleted=state.deleted.filter(d=>d.characterId!==id);
    state.messages=state.messages.filter(m=>m.characterId!==id);

    saveState();

    renderDeleted();
    renderList();

    showToast("영구적으로 삭제했습니다.");
  }
});

document.getElementById("deletedBackButton").addEventListener("click",returnToList);

/* =========================================================
   초기화 / 시스템 다크모드
========================================================= */

applyDarkMode();
renderUserProfile();
renderList();

if(window.matchMedia){
  window.matchMedia("(prefers-color-scheme:dark)")
    .addEventListener?.("change",()=>{
      if(state.darkMode===null || state.darkMode===undefined){
        applyDarkMode();
        renderSettings();
      }
    });
}

/* =========================================================
   전역 ESC / 외부 클릭
========================================================= */

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    closeFilterPopup();

    if(document.getElementById("profileOverlay").classList.contains("open")){
      closeProfileSheet();
    }
  }
});

document.addEventListener("click",e=>{
  const popup=document.getElementById("filterPopup");
  const filterButton=document.getElementById("filterButton");

  if(
    !popup.classList.contains("hidden") &&
    !popup.contains(e.target) &&
    !filterButton.contains(e.target)
  ){
    closeFilterPopup();
  }
});

/* =========================================================
   브라우저 뒤로가기
========================================================= */

window.addEventListener("popstate",()=>{
  returnToList();
});

</script>
