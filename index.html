<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>메시지 — 프로토타입</title>

<style>
:root{
  --blue:#0a84ff;
  --blue2:#007aff;
  --green:#30d158;
  --red:#ff453a;
  --orange:#ff9f0a;
  --purple:#bf5af2;

  --bg:#ffffff;
  --group:#f2f2f7;
  --card:#ffffff;
  --text:#000000;
  --secondary:#8e8e93;
  --separator:rgba(60,60,67,.20);
  --overlay:rgba(0,0,0,.25);

  --nav-blur:rgba(255,255,255,.78);
  --sheet:rgba(255,255,255,.92);
  --input:#f2f2f7;
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000;
    --group:#1c1c1e;
    --card:#1c1c1e;
    --text:#ffffff;
    --secondary:#98989f;
    --separator:rgba(84,84,88,.65);
    --overlay:rgba(0,0,0,.55);
    --nav-blur:rgba(0,0,0,.72);
    --sheet:rgba(28,28,30,.94);
    --input:#1c1c1e;
  }
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}

body{
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",
    "Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;
  color:var(--text);
}

button,input,textarea{
  font:inherit;
}

button{
  -webkit-appearance:none;
  appearance:none;
}

.app{
  position:relative;
  width:100%;
  max-width:430px;
  height:100vh;
  height:100dvh;
  margin:0 auto;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
  transform:translateX(0);
  transition:transform .34s cubic-bezier(.32,.72,0,1);
  z-index:1;
}

.screen.right{
  transform:translateX(100%);
}

.screen.left{
  transform:translateX(-18%);
  filter:brightness(.82);
}

.hidden{
  display:none!important;
}

/* ---------- common ---------- */

.scroll{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}

::-webkit-scrollbar{
  width:0;
  height:0;
}

.ios-btn{
  border:0;
  background:none;
  color:var(--blue);
  cursor:pointer;
  padding:7px 4px;
  font-size:17px;
}

.ios-btn:active{
  opacity:.55;
}

.icon-btn{
  width:34px;
  height:34px;
  border:0;
  background:none;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border-radius:50%;
  padding:0;
}

.icon-btn:active{
  background:rgba(120,120,128,.12);
}

.icon-btn svg{
  width:22px;
  height:22px;
}

.separator{
  height:.5px;
  background:var(--separator);
  flex-shrink:0;
}

.empty{
  color:var(--secondary);
  text-align:center;
  padding:60px 25px;
  line-height:1.55;
  font-size:15px;
}

.avatar{
  border-radius:50%;
  flex-shrink:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:700;
  background:linear-gradient(135deg,#5e5ce6,#bf5af2);
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* ---------- list ---------- */

.list-nav{
  flex-shrink:0;
  padding:
    calc(env(safe-area-inset-top,0px) + 6px)
    16px
    0;
  background:var(--bg);
}

.list-nav-row{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.list-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.list-title{
  font-size:34px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-1.1px;
  padding:8px 0 13px;
}

.profile-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:9px 16px 13px;
  cursor:pointer;
}

.profile-avatar{
  width:52px;
  height:52px;
  font-size:18px;
}

.profile-copy{
  min-width:0;
  flex:1;
}

.profile-name{
  font-size:17px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-status{
  font-size:14px;
  color:var(--secondary);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chevron{
  color:var(--secondary);
  font-size:28px;
  font-weight:300;
}

.conv-list{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding-bottom:105px;
}

.section-label{
  padding:14px 16px 7px;
  font-size:13px;
  color:var(--secondary);
  font-weight:600;
}

.conv-row{
  display:flex;
  align-items:center;
  min-height:72px;
  padding:7px 16px 7px 10px;
  gap:11px;
  cursor:pointer;
  position:relative;
}

.conv-row:active{
  background:var(--group);
}

.select-circle{
  width:28px;
  height:28px;
  flex:0 0 28px;
  border:2px solid #c7c7cc;
  border-radius:50%;
  margin-left:1px;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.18s;
}

.select-circle.selected{
  border-color:var(--blue);
  background:var(--blue);
  color:#fff;
}

.select-circle svg{
  width:15px;
  height:15px;
}

.conv-avatar{
  width:52px;
  height:52px;
  font-size:18px;
}

.conv-content{
  flex:1;
  min-width:0;
  align-self:stretch;
  border-bottom:.5px solid var(--separator);
  padding:8px 0 8px;
}

.conv-row:last-child .conv-content{
  border-bottom:0;
}

.conv-top{
  display:flex;
  gap:7px;
  align-items:center;
}

.conv-name{
  min-width:0;
  flex:1;
  font-size:17px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.conv-name.unread{
  font-weight:800;
}

.pin{
  color:var(--secondary);
  font-size:13px;
  transform:rotate(-35deg);
}

.conv-time{
  flex-shrink:0;
  color:var(--secondary);
  font-size:14px;
}

.conv-bottom{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:2px;
}

.unread-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--blue);
  flex-shrink:0;
}

.conv-preview{
  flex:1;
  min-width:0;
  font-size:15px;
  color:var(--secondary);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.compose-fab{
  position:absolute;
  right:17px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 15px);
  width:54px;
  height:54px;
  border-radius:50%;
  border:1px solid rgba(120,120,128,.18);
  background:rgba(242,242,247,.94);
  color:var(--blue);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 18px rgba(0,0,0,.14);
  cursor:pointer;
  z-index:5;
}

@media (prefers-color-scheme:dark){
  .compose-fab{
    background:rgba(44,44,46,.94);
  }
}

.compose-fab svg{
  width:25px;
  height:25px;
}

.list-filter-popover{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 51px);
  right:12px;
  width:262px;
  border-radius:19px;
  background:var(--sheet);
  border:.5px solid rgba(120,120,128,.18);
  box-shadow:0 12px 40px rgba(0,0,0,.20);
  backdrop-filter:blur(28px) saturate(170%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  overflow:hidden;
  z-index:100;
  transform-origin:top right;
  animation:pop .18s ease;
}

@keyframes pop{
  from{opacity:0;transform:scale(.94) translateY(-4px)}
  to{opacity:1;transform:scale(1)}
}

.pop-row{
  width:100%;
  min-height:47px;
  padding:0 16px;
  border:0;
  background:none;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  font-size:16px;
  cursor:pointer;
}

.pop-row:active{
  background:rgba(120,120,128,.12);
}

.pop-section{
  padding:13px 16px 6px;
  color:var(--secondary);
  font-size:13px;
  font-weight:600;
}

.pop-divider{
  height:.5px;
  background:var(--separator);
  margin:3px 0;
}

.radio-dot{
  width:18px;
  height:18px;
  border:1.5px solid var(--secondary);
  border-radius:50%;
}

.radio-dot.active{
  border:5px solid var(--blue);
}

.pop-check{
  color:var(--blue);
  font-size:20px;
  font-weight:700;
}

.tap-cover{
  position:absolute;
  inset:0;
  z-index:90;
}

/* ---------- edit mode ---------- */

.edit-nav-title{
  font-size:17px;
  font-weight:700;
  position:absolute;
  left:50%;
  transform:translateX(-50%);
}

.edit-toolbar{
  flex-shrink:0;
  border-top:.5px solid var(--separator);
  min-height:55px;
  padding:
    8px 14px
    calc(env(safe-area-inset-bottom,0px) + 8px);
  display:flex;
  justify-content:space-between;
  gap:7px;
  background:var(--nav-blur);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.edit-action{
  flex:1;
  border:0;
  background:none;
  color:var(--blue);
  font-size:13px;
  cursor:pointer;
  padding:5px 2px;
}

.edit-action:disabled{
  opacity:.35;
}

.edit-action.danger{
  color:var(--red);
}

/* ---------- chat ---------- */

.chat-nav{
  flex-shrink:0;
  padding:
    calc(env(safe-area-inset-top,0px) + 4px)
    12px
    4px;
  background:var(--nav-blur);
  backdrop-filter:blur(22px) saturate(170%);
  -webkit-backdrop-filter:blur(22px) saturate(170%);
  border-bottom:.5px solid var(--separator);
  position:relative;
  z-index:2;
}

.chat-nav-row{
  min-height:51px;
  display:grid;
  grid-template-columns:78px 1fr 42px;
  align-items:center;
}

.back-chat{
  display:flex;
  align-items:center;
  gap:1px;
  padding:6px 0;
  font-size:17px;
  color:var(--blue);
  border:0;
  background:none;
  cursor:pointer;
}

.back-chat svg{
  width:12px;
  height:20px;
}

.chat-contact{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}

.chat-contact-avatar{
  width:31px;
  height:31px;
  font-size:11px;
}

.chat-contact-name{
  margin-top:1px;
  max-width:160px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:2px;
}

.chat-contact-name span{
  font-size:9px;
  color:var(--secondary);
}

.chat-info{
  justify-self:end;
}

.messages{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:9px 12px 12px;
  display:flex;
  flex-direction:column;
}

.date-divider{
  text-align:center;
  font-size:12px;
  color:var(--secondary);
  margin:12px 0 10px;
  font-weight:500;
}

.message-time{
  text-align:center;
  color:var(--secondary);
  font-size:11px;
  margin:8px 0 3px;
}

.bubble-row{
  display:flex;
  margin:1px 0;
}

.bubble-row.me{
  justify-content:flex-end;
}

.bubble-row.them{
  justify-content:flex-start;
}

.bubble{
  max-width:76%;
  padding:8px 13px;
  font-size:16.5px;
  line-height:1.28;
  white-space:pre-wrap;
  word-break:break-word;
  color:#fff;
  border-radius:19px;
  transition:background .15s;
}

.bubble.me{
  background:var(--blue);
  border-bottom-right-radius:5px;
}

.bubble.them{
  border-bottom-left-radius:5px;
}

.bubble-row.same.me .bubble{
  border-top-right-radius:5px;
  border-bottom-right-radius:5px;
}

.bubble-row.same.them .bubble{
  border-top-left-radius:5px;
  border-bottom-left-radius:5px;
}

.bubble-row.last-in-group.me .bubble{
  border-bottom-right-radius:5px;
}

.bubble-row.last-in-group.them .bubble{
  border-bottom-left-radius:5px;
}

.read-receipt{
  text-align:right;
  color:var(--secondary);
  font-size:11px;
  margin:3px 6px 1px;
}

.input-area{
  flex-shrink:0;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);
  background:var(--nav-blur);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-top:.5px solid var(--separator);
}

.plus-button{
  width:31px;
  height:31px;
  flex-shrink:0;
  border:1.5px solid var(--secondary);
  border-radius:50%;
  color:var(--secondary);
  background:none;
  font-size:23px;
  line-height:1;
  cursor:pointer;
}

.input-wrap{
  flex:1;
  min-width:0;
  min-height:35px;
  display:flex;
  align-items:flex-end;
  border:1px solid var(--separator);
  border-radius:19px;
  background:var(--input);
}

.chat-input{
  flex:1;
  min-width:0;
  min-height:33px;
  max-height:110px;
  padding:7px 11px;
  resize:none;
  border:0;
  outline:0;
  background:none;
  color:var(--text);
  font-size:16px;
  line-height:1.3;
}

.chat-input::placeholder{
  color:var(--secondary);
}

.send-button{
  width:31px;
  height:31px;
  flex-shrink:0;
  border:0;
  border-radius:50%;
  background:var(--blue);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.28;
  pointer-events:none;
  cursor:pointer;
  transition:.16s;
}

.send-button.ready{
  opacity:1;
  pointer-events:auto;
}

.send-button svg{
  width:15px;
  height:15px;
  transform:translateX(1px);
}

/* ---------- standard nav ---------- */

.standard-nav{
  flex-shrink:0;
  height:calc(env(safe-area-inset-top,0px) + 54px);
  padding:
    env(safe-area-inset-top,0px)
    12px
    0;
  display:grid;
  grid-template-columns:90px 1fr 90px;
  align-items:center;
  border-bottom:.5px solid var(--separator);
  background:var(--nav-blur);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
}

.standard-title{
  text-align:center;
  font-size:17px;
  font-weight:700;
}

.standard-right{
  display:flex;
  justify-content:flex-end;
}

/* ---------- grouped settings ---------- */

.group-page{
  flex:1;
  overflow-y:auto;
  background:var(--group);
  padding:17px 0 calc(env(safe-area-inset-bottom,0px) + 24px);
}

.page-section-title{
  padding:0 17px 7px;
  color:var(--secondary);
  font-size:13px;
}

.group-card{
  background:var(--card);
  margin-bottom:22px;
  border-top:.5px solid var(--separator);
  border-bottom:.5px solid var(--separator);
}

.setting-row{
  width:100%;
  min-height:53px;
  padding:0 17px;
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  border-bottom:.5px solid var(--separator);
  background:none;
  color:var(--text);
  text-align:left;
  cursor:pointer;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-row:active{
  background:var(--group);
}

.setting-main{
  flex:1;
  min-width:0;
}

.setting-title{
  font-size:16px;
}

.setting-sub{
  color:var(--secondary);
  font-size:13px;
  margin-top:2px;
}

.setting-chev{
  color:#c7c7cc;
  font-size:25px;
  font-weight:300;
}

.ios-switch{
  width:51px;
  height:31px;
  border-radius:16px;
  border:0;
  background:#787880;
  padding:2px;
  flex-shrink:0;
  cursor:pointer;
  transition:.2s;
}

.ios-switch span{
  display:block;
  width:27px;
  height:27px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:.2s;
}

.ios-switch.on{
  background:var(--green);
}

.ios-switch.on span{
  transform:translateX(20px);
}

/* ---------- profile / character detail ---------- */

.detail-page{
  flex:1;
  overflow-y:auto;
  background:var(--group);
  padding:20px 0 calc(env(safe-area-inset-bottom,0px) + 24px);
}

.detail-hero{
  background:var(--bg);
  text-align:center;
  padding:12px 20px 25px;
}

.big-avatar{
  width:104px;
  height:104px;
  margin:0 auto;
  font-size:35px;
}

.detail-name{
  font-size:23px;
  font-weight:700;
  margin-top:12px;
}

.detail-sub{
  color:var(--secondary);
  font-size:14px;
  margin-top:3px;
}

.photo-button{
  color:var(--blue);
  border:0;
  background:none;
  font-size:16px;
  font-weight:600;
  margin-top:9px;
  cursor:pointer;
}

.text-field{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  padding:0;
}

.color-picker-row{
  padding:15px 17px;
  display:flex;
  align-items:center;
  gap:10px;
}

.color-picker-row input[type=color]{
  width:52px;
  height:36px;
  border:0;
  padding:0;
  background:none;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.color-preview{
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.7);
  box-shadow:0 1px 4px rgba(0,0,0,.2);
}

.admin-note{
  padding:0 17px;
  color:var(--secondary);
  font-size:13px;
  line-height:1.45;
}

.action-card{
  margin-top:21px;
}

.delete-character{
  color:var(--red);
}

/* ---------- admin thread ---------- */

.admin-thread{
  padding:0 12px 15px;
}

.admin-message{
  background:var(--card);
  border-bottom:.5px solid var(--separator);
  padding:11px 12px;
  display:flex;
  gap:9px;
  align-items:flex-start;
}

.admin-message-who{
  width:50px;
  flex-shrink:0;
  font-size:12px;
  color:var(--secondary);
  padding-top:2px;
}

.admin-message-text{
  flex:1;
  min-width:0;
  font-size:14px;
  line-height:1.35;
  white-space:pre-wrap;
  word-break:break-word;
}

.admin-message-time{
  color:var(--secondary);
  font-size:11px;
  margin-top:3px;
}

.admin-message-delete{
  border:0;
  background:none;
  color:var(--secondary);
  cursor:pointer;
  font-size:18px;
  padding:0;
}

.admin-composer{
  background:var(--card);
  margin:0 12px;
  border-radius:14px;
  overflow:hidden;
  border:.5px solid var(--separator);
}

.admin-textarea{
  display:block;
  width:100%;
  min-height:94px;
  border:0;
  outline:0;
  resize:none;
  background:transparent;
  color:var(--text);
  padding:12px;
  font-size:16px;
}

.admin-date-row{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:8px;
  padding:10px;
  border-top:.5px solid var(--separator);
}

.admin-date-row input{
  width:100%;
  min-width:0;
  height:35px;
  border:0;
  border-radius:8px;
  background:var(--input);
  color:var(--text);
  padding:0 8px;
  font-size:13px;
}

.small-now{
  border:0;
  border-radius:8px;
  background:var(--input);
  color:var(--blue);
  padding:0 10px;
  cursor:pointer;
}

.admin-send-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  border-top:.5px solid var(--separator);
}

.admin-hint{
  color:var(--secondary);
  font-size:11px;
}

.primary-button{
  border:0;
  border-radius:10px;
  background:var(--blue);
  color:#fff;
  padding:9px 15px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

/* ---------- contact ---------- */

.contact-page{
  flex:1;
  overflow-y:auto;
  padding:15px 20px calc(env(safe-area-inset-bottom,0px) + 30px);
  text-align:center;
}

.contact-name{
  font-size:24px;
  font-weight:700;
  margin-top:12px;
}

.contact-phone{
  color:var(--secondary);
  font-size:14px;
  margin-top:4px;
}

.contact-actions{
  display:flex;
  justify-content:center;
  gap:28px;
  margin-top:25px;
}

.contact-action{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
}

.contact-action button{
  width:55px;
  height:55px;
  border:0;
  border-radius:50%;
  background:var(--group);
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.contact-action svg{
  width:23px;
  height:23px;
}

.contact-action span{
  font-size:12px;
  color:var(--secondary);
}

/* ---------- new message ---------- */

.new-search{
  margin:10px 16px 8px;
  height:38px;
  border-radius:10px;
  background:var(--input);
  display:flex;
  align-items:center;
  gap:7px;
  padding:0 11px;
  color:var(--secondary);
}

.new-search input{
  flex:1;
  border:0;
  outline:0;
  background:none;
  color:var(--text);
  font-size:16px;
}

.character-picker-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  background:none;
  color:var(--text);
  padding:9px 16px;
  text-align:left;
  cursor:pointer;
}

.character-picker-row:active{
  background:var(--group);
}

.character-picker-avatar{
  width:48px;
  height:48px;
  font-size:16px;
}

.character-picker-name{
  font-size:17px;
  font-weight:600;
}

.character-picker-phone{
  font-size:13px;
  color:var(--secondary);
  margin-top:2px;
}

/* ---------- recently deleted ---------- */

.deleted-info{
  color:var(--secondary);
  font-size:13px;
  padding:0 17px 12px;
  line-height:1.45;
}

.deleted-actions{
  display:flex;
  gap:8px;
  margin-left:auto;
}

.inline-action{
  border:0;
  background:none;
  color:var(--blue);
  font-size:13px;
  cursor:pointer;
  padding:5px;
}

.inline-action.red{
  color:var(--red);
}

/* ---------- sheet ---------- */

.sheet-cover{
  position:absolute;
  inset:0;
  z-index:300;
  background:var(--overlay);
  display:flex;
  align-items:flex-end;
  opacity:0;
  pointer-events:none;
  transition:.22s;
}

.sheet-cover.open{
  opacity:1;
  pointer-events:auto;
}

.bottom-sheet{
  width:100%;
  max-height:86%;
  overflow-y:auto;
  background:var(--sheet);
  border-radius:24px 24px 0 0;
  padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 20px);
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px);
}

.sheet-cover.open .bottom-sheet{
  transform:translateY(0);
}

.grabber{
  width:38px;
  height:5px;
  border-radius:5px;
  background:#8e8e93;
  opacity:.5;
  margin:3px auto 15px;
}

.sheet-title{
  text-align:center;
  font-size:20px;
  font-weight:700;
  margin-bottom:16px;
}

.sheet-button{
  width:100%;
  min-height:49px;
  border:0;
  border-bottom:.5px solid var(--separator);
  background:none;
  color:var(--blue);
  font-size:17px;
  cursor:pointer;
}

.sheet-button.red{
  color:var(--red);
}

.sheet-cancel{
  margin-top:12px;
  border-radius:14px;
  background:var(--group);
  border:0;
  color:var(--blue);
  font-size:17px;
  font-weight:600;
  width:100%;
  height:52px;
  cursor:pointer;
}

/* ---------- alerts ---------- */

.toast{
  position:absolute;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  transform:translate(-50%,20px);
  padding:11px 15px;
  border-radius:15px;
  background:rgba(40,40,42,.90);
  color:#fff;
  font-size:14px;
  z-index:500;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  white-space:nowrap;
  backdrop-filter:blur(20px);
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media (min-width:431px){
  .app{
    box-shadow:0 0 40px rgba(0,0,0,.35);
  }
}

function uid(){
  return Math.random().toString(36).slice(2,10)

    + Math.random().toString(36).slice(2,5);
}

function initials(name){
  const text = String(name || "나").trim();
  if(!text) return "나";
  const parts = text.split(/\s+/);
  if(parts.length === 1) return parts[0].slice(0,2);
  return (parts[0][0] || "") + (parts[1][0] || "");
}

function colorFor(id){
  let hash = 0;
  for(const ch of String(id || "")){
    hash = (hash * 31 + ch.charCodeAt(0)) % 997;
  }
  return AVATAR_COLORS[hash % AVATAR_COLORS.length];
}

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function normalizeTimestamp(value){
  if(typeof value === "number" && Number.isFinite(value)) return value;
  const parsed = new Date(value).getTime();
  return Number.isFinite(parsed) ? parsed : Date.now();
}

function migrateState(raw){
  const defaults = seedData();

  if(!raw || typeof raw !== "object"){
    return defaults;
  }

  const migrated = raw;

  if(!Array.isArray(migrated.characters)){
    migrated.characters = [];
  }

  if(!Array.isArray(migrated.messages)){
    migrated.messages = [];
  }

  if(!migrated.profile || typeof migrated.profile !== "object"){
    migrated.profile = {...defaults.profile};
  }

  migrated.profile.name =
    migrated.profile.name || defaults.profile.name;

  migrated.profile.status =
    migrated.profile.status || defaults.profile.status;

  if(typeof migrated.profile.photo !== "string"){
    migrated.profile.photo = "";
  }

  if(!migrated.settings || typeof migrated.settings !== "object"){
    migrated.settings = {};
  }

  migrated.settings.spamFiltering =
    !!migrated.settings.spamFiltering;

  migrated.settings.unknownFiltering =
    !!migrated.settings.unknownFiltering;

  migrated.settings.smsFiltering =
    !!migrated.settings.smsFiltering;

  migrated.characters = migrated.characters.map((c,index)=>{
    const item = c || {};

    return {
      id:String(item.id || uid()),
      name:String(item.name || `캐릭터 ${index+1}`),
      phone:String(item.phone || ""),
      photo:typeof item.photo === "string" ? item.photo : "",
      active:item.active !== false,
      bubbleColor:
        typeof item.bubbleColor === "string" && item.bubbleColor
          ? item.bubbleColor
          : "#0a84ff",
      pinned:!!item.pinned,
      spam:!!item.spam,
      deleted:!!item.deleted,
      deletedAt:item.deletedAt || null
    };
  });

  migrated.messages = migrated.messages.map(m=>{
    const item = m || {};

    return {
      id:String(item.id || uid()),
      characterId:String(
        item.characterId ||
        item.character ||
        item.charId ||
        ""
      ),
      sender:item.sender === "me" ? "me" : "them",
      text:String(item.text || ""),
      ts:normalizeTimestamp(item.ts || item.timestamp || Date.now()),
      readByUser:
        item.sender === "me"
          ? true
          : !!item.readByUser
    };
  });

  migrated.version = 3;

  return migrated;
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);

    if(raw){
      state = migrateState(JSON.parse(raw));
    }else{
      state = seedData();
    }
  }catch(error){
    state = seedData();
  }

  saveState();
}

let saveTimer = null;

function saveState(){
  clearTimeout(saveTimer);

  saveTimer = setTimeout(()=>{
    try{
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
      );
    }catch(error){
      console.error("localStorage 저장 실패",error);
    }
  },80);
}

function characterById(id){
  return state.characters.find(c=>c.id===id);
}

function messagesFor(id){
  return state.messages
    .filter(m=>m.characterId===id)
    .sort((a,b)=>a.ts-b.ts);
}

function lastMessage(id){
  const messages = messagesFor(id);
  return messages.length
    ? messages[messages.length-1]
    : null;
}

function unreadCount(id){
  return state.messages.filter(
    m=>
      m.characterId===id &&
      m.sender==="them" &&
      !m.readByUser
  ).length;
}

function avatarContent(entity){
  if(entity && entity.photo){
    return `<img src="${entity.photo}" alt="">`;
  }

  return escapeHtml(initials(entity?.name || "나"));
}

function applyAvatar(element,entity){
  if(!element) return;

  element.style.background =
    colorFor(entity?.id || entity?.name || "profile");

  element.innerHTML = avatarContent(entity);
}

function formatTime(ts){
  const date = new Date(ts);
  let hour = date.getHours();

  const period = hour >= 12 ? "오후" : "오전";
  hour = hour % 12;

  if(hour === 0) hour = 12;

  return `${period} ${hour}:${String(date.getMinutes()).padStart(2,"0")}`;
}

function formatConversationTime(ts){
  const date = new Date(ts);
  const now = new Date();

  const sameDate =
    date.getFullYear()===now.getFullYear() &&
    date.getMonth()===now.getMonth() &&
    date.getDate()===now.getDate();

  if(sameDate){
    return formatTime(ts);
  }

  const yesterday = new Date();
  yesterday.setDate(now.getDate()-1);

  const yesterdayMatch =
    date.getFullYear()===yesterday.getFullYear() &&
    date.getMonth()===yesterday.getMonth() &&
    date.getDate()===yesterday.getDate();

  if(yesterdayMatch) return "어제";

  if(date.getFullYear()===now.getFullYear()){
    return `${date.getMonth()+1}/${date.getDate()}`;
  }

  return `${date.getFullYear()}. ${date.getMonth()+1}. ${date.getDate()}.`;
}

function formatDate(ts){
  const date = new Date(ts);
  const now = new Date();

  if(
    date.getFullYear()===now.getFullYear() &&
    date.getMonth()===now.getMonth() &&
    date.getDate()===now.getDate()
  ){
    return "오늘";
  }

  return `${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일`;
}

function sameDay(a,b){
  const x = new Date(a);
  const y = new Date(b);

  return (
    x.getFullYear()===y.getFullYear() &&
    x.getMonth()===y.getMonth() &&
    x.getDate()===y.getDate()
  );
}

function toDateInput(ts){
  const d = new Date(ts);
  const year = d.getFullYear();
  const month = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}

function toTimeInput(ts){
  const d = new Date(ts);

  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function combineDateTime(dateValue,timeValue){
  if(!dateValue) return Date.now();

  const time = timeValue || "00:00";

  const date = new Date(`${dateValue}T${time}:00`);

  return Number.isFinite(date.getTime())
    ? date.getTime()
    : Date.now();
}

function generatePhone(){
  const n = ()=>String(Math.floor(1000+Math.random()*9000));
  return `010-${n()}-${n()}`;
}

function showToast(text){
  const toast = document.getElementById("toast");

  toast.classList.add("show");

  clearTimeout(showToast.timer);

function getVisibleCharacters(){
  let characters = state.characters.filter(c=>c.active !== false);

  if(currentFilter === "messages"){
    characters = characters.filter(
      c=>!c.deleted && !c.spam
    );
  }

  if(currentFilter === "spam"){
    characters = characters.filter(
      c=>!c.deleted && c.spam
    );
  }

  if(currentFilter === "deleted"){
    characters = characters.filter(
      c=>c.deleted
    );
  }

  if(unreadOnly){
    characters = characters.filter(
      c=>unreadCount(c.id)>0
    );
  }

  return characters.sort((a,b)=>{
    if(currentFilter !== "deleted"){
      if(!!a.pinned !== !!b.pinned){
        return a.pinned ? -1 : 1;
      }
    }

    const aLast = lastMessage(a.id);
    const bLast = lastMessage(b.id);

    const aTime =
      currentFilter==="deleted"
        ? (a.deletedAt || 0)
        : (aLast?.ts || 0);

    const bTime =
      currentFilter==="deleted"
        ? (b.deletedAt || 0)
        : (bLast?.ts || 0);

    return bTime-aTime;
  });
}

function renderConversationList(){
  const list = document.getElementById("conversationList");

  if(currentFilter === "deleted"){
    renderDeletedList();
    return;
  }

  const characters = getVisibleCharacters();

  if(!characters.length){
    let text = "대화가 없습니다.";

    if(currentFilter==="spam"){
      text = "스팸으로 분류된 대화가 없습니다.";
    }

    if(unreadOnly){
      text = "읽지 않은 메시지가 없습니다.";
    }

    list.innerHTML =
      `<div class="empty">${text}</div>`;

    return;
  }

  list.innerHTML = characters.map(c=>{
    const last = lastMessage(c.id);
    const unread = unreadCount(c.id)>0;

    let preview = "대화 없음";

    if(last){
      preview =
        last.sender==="me"
          ? `나: ${last.text}`
          : last.text;
    }

    const selected =
      selectedConversationIds.has(c.id);

    return `
      <div
        class="conv-row"
        data-id="${escapeHtml(c.id)}"
      >
        ${
          editMode
            ? `
              <div class="select-circle ${selected ? "selected":""}">
                ${
                  selected
                    ? `
                      <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12l4 4L19 6"/>
                      </svg>
                    `
                    : ""
                }
              </div>
            `
            : ""
        }

        <div
          class="avatar conv-avatar"
          style="background:${colorFor(c.id)}"
        >
          ${avatarContent(c)}
        </div>

        <div class="conv-content">

          <div class="conv-top">

            <div class="conv-name ${unread ? "unread":""}">
              ${escapeHtml(c.name)}
            </div>

            ${
              c.pinned
                ? `<span class="pin">⌖</span>`
                : ""
            }

            <div class="conv-time">
              ${last ? formatConversationTime(last.ts) : ""}
            </div>

          </div>

          <div class="conv-bottom">
            ${
              unread
                ? `<span class="unread-dot"></span>`
                : ""
            }

            <div class="conv-preview">
              ${escapeHtml(preview)}
            </div>
          </div>

        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".conv-row").forEach(row=>{
    row.addEventListener("click",()=>{
      const id = row.dataset.id;

      if(editMode){
        toggleConversationSelection(id);
      }else{
        openChat(id);
      }
    });
  });

  updateEditToolbar();
}

function renderDeletedList(){
  const list = document.getElementById("conversationList");
  const deleted = state.characters
    .filter(c=>c.deleted)
    .sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));

  if(!deleted.length){
    list.innerHTML =
      `<div class="empty">최근 삭제된 대화가 없습니다.</div>`;
    return;
  }

  list.innerHTML =
    `<div class="deleted-info">
      삭제된 대화는 여기에서 복구하거나 영구적으로 삭제할 수 있습니다.
    </div>`
    +
    deleted.map(c=>{
      const last = lastMessage(c.id);

      return `
        <div class="conv-row" data-id="${escapeHtml(c.id)}">

          <div
            class="avatar conv-avatar"
            style="background:${colorFor(c.id)}"
          >
            ${avatarContent(c)}
          </div>

          <div class="conv-content">

            <div class="conv-top">
              <div class="conv-name">${escapeHtml(c.name)}</div>

              <div class="deleted-actions">
                <button class="inline-action" data-restore="${escapeHtml(c.id)}">
                  복구
                </button>

                <button class="inline-action red" data-permanent="${escapeHtml(c.id)}">
                  삭제
                </button>
              </div>
            </div>

            <div class="conv-bottom">
              <div class="conv-preview">
                ${escapeHtml(last ? last.text : "대화 없음")}
              </div>
            </div>

          </div>

        </div>
      `;
    }).join("");

  list.querySelectorAll("[data-restore]").forEach(button=>{
    button.onclick = event=>{
      event.stopPropagation();

      const character = characterById(button.dataset.restore);

      if(!character) return;

      character.deleted = false;
      character.deletedAt = null;

      saveState();
      renderDeletedList();
      renderAdminCharacterList();

      showToast("대화를 복구했습니다");
    };
  });

  list.querySelectorAll("[data-permanent]").forEach(button=>{
    button.onclick = event=>{
      event.stopPropagation();

      permanentlyDeleteConversation(
        button.dataset.permanent
      );
    };
  });
}

    visible.length>0 &&
    visible.every(c=>selectedConversationIds.has(c.id));

  if(allSelected){
    selectedConversationIds.clear();
  }else{
    visible.forEach(c=>selectedConversationIds.add(c.id));
  }

  renderConversationList();

    deleteButton

    selectedCharacters.length>0 &&
    selectedCharacters.every(c=>c.pinned);

  saveState();
  renderConversationList();

========================================================= */

function openChat(characterId){
  const character = characterById(characterId);

  if(!character || character.deleted) return;

  currentChatId = characterId;

  state.messages.forEach(message=>{
    if(
      message.characterId===characterId &&
      message.sender==="them"
    ){
      message.readByUser = true;
    }
  });

  saveState();

  renderChat();

  openScreen(screens.chat);
  renderConversationList();
}

function closeChat(){
  closeScreen(screens.chat);

  setTimeout(()=>{
    currentChatId = null;
  },250);
}

function renderChat(){
  const character = characterById(currentChatId);

  if(!character) return;

  document.getElementById("chatName").textContent =
    character.name;

  applyAvatar(
    document.getElementById("chatAvatar"),
    character
  );

  renderMessages();
}

function renderMessages(){
  const area = document.getElementById("messagesArea");

  const character = characterById(currentChatId);

  if(!character){
    area.innerHTML = "";
    return;
  }

  const messages = messagesFor(currentChatId);

  if(!messages.length){
    area.innerHTML =
      `<div class="empty">아직 메시지가 없습니다.</div>`;
    return;
  }

  let html = "";

  messages.forEach((message,index)=>{
    const previous = messages[index-1];
    const next = messages[index+1];

    const newDay =
      !previous ||
      !sameDay(previous.ts,message.ts);

    if(newDay){
      html += `
        <div class="date-divider">
          ${formatDate(message.ts)}
        </div>
      `;
    }

    const showTime =
      !previous ||
      previous.sender!==message.sender ||
      message.ts-previous.ts>30*60000 ||
      !sameDay(previous.ts,message.ts);

    if(showTime){
      html += `
        <div class="message-time">
          ${formatTime(message.ts)}
        </div>
      `;
    }

    const samePrevious =
      previous &&
      previous.sender===message.sender &&
      sameDay(previous.ts,message.ts) &&
      message.ts-previous.ts<=30*60000;

    const sameNext =
      next &&
      next.sender===message.sender &&
      sameDay(next.ts,message.ts) &&
      next.ts-message.ts<=30*60000;

    const color =
      message.sender==="them"
        ? character.bubbleColor
        : "";

    html += `
      <div
        class="bubble-row ${message.sender}
          ${samePrevious ? "same":""}
          ${!sameNext ? "last-in-group":""}"
      >
        <div
          class="bubble ${message.sender}"
          ${
            message.sender==="them"
              ? `style="background:${escapeHtml(color || "#0a84ff")}"`
              : ""
          }
        >${escapeHtml(message.text)}</div>
      </div>
    `;
  });

  const last = messages[messages.length-1];

  if(last && last.sender==="me"){
    html += `<div class="read-receipt">읽음</div>`;
  }

  area.innerHTML = html;

  requestAnimationFrame(()=>{
    area.scrollTop = area.scrollHeight;
  });
}

function sendUserMessage(){
  const input =
    document.getElementById("userMessageInput");

  const text = input.value.trim();

  if(!text || !currentChatId) return;

  state.messages.push({
    id:uid(),
    characterId:currentChatId,
    sender:"me",
    text,
    ts:Date.now(),
    readByUser:true
  });

  input.value = "";
  input.style.height = "auto";

  document.getElementById("userSendButton")

  saveState();

  renderConversationList();
}

function renderCharacterPicker(query){
  const list =
    document.getElementById("characterPickerList");

  const search =
    String(query || "").trim().toLowerCase();

  const characters = state.characters
    .filter(c=>!c.deleted && c.active!==false)
    .filter(c=>{
      if(!search) return true;

      return (
        c.name.toLowerCase().includes(search) ||
        String(c.phone||"").includes(search)
      );
    });

  if(!characters.length){
    list.innerHTML =
      `<div class="empty">일치하는 캐릭터가 없습니다.</div>`;
    return;
  }

  list.innerHTML =
    `<div class="section-label">캐릭터</div>`
    +
    characters.map(c=>`
      <button
        class="character-picker-row"
        data-character="${escapeHtml(c.id)}"

          class="avatar character-picker-avatar"
          style="background:${colorFor(c.id)}"

          <div class="character-picker-phone">

      </button>
    `).join("");

  list.querySelectorAll("[data-character]")
    .forEach(button=>{
      button.onclick = ()=>{
        closeScreen(screens.newMessage);

        setTimeout(()=>{
          openChat(button.dataset.character);
        },100);
      };
    });
}

function openDeletedScreen(){
  renderFullDeletedScreen();
  openScreen(screens.deleted);
}

function renderFullDeletedScreen(){
  const list =
    document.getElementById("deletedList");

  const deleted =
    state.characters
      .filter(c=>c.deleted)
      .sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));

  if(!deleted.length){
    list.innerHTML =
      `<div class="empty">최근 삭제된 대화가 없습니다.</div>`;

    return;
  }

  list.innerHTML =
    `<div class="deleted-info">
      삭제된 대화를 복구하거나 영구적으로 삭제할 수 있습니다.
    </div>`
    +
    deleted.map(c=>`
      <div class="conv-row">

        <div
          class="avatar conv-avatar"
          style="background:${colorFor(c.id)}"
        >
          ${avatarContent(c)}
        </div>

        <div class="conv-content">

          <div class="conv-top">
            <div class="conv-name">
              ${escapeHtml(c.name)}
            </div>
          </div>

          <div class="conv-bottom">
            <button
              class="inline-action"
              data-full-restore="${escapeHtml(c.id)}"
            >
              복구
            </button>

            <button
              class="inline-action red"
              data-full-delete="${escapeHtml(c.id)}"
            >
              영구 삭제
            </button>
          </div>

        </div>
      </div>
    `).join("");

  list.querySelectorAll("[data-full-restore]")
    .forEach(button=>{
      button.onclick = ()=>{
        const c =
          characterById(button.dataset.fullRestore);

        if(!c) return;

        c.deleted = false;
        c.deletedAt = null;

        saveState();

        renderFullDeletedScreen();
        renderConversationList();
        renderAdminCharacterList();

        showToast("대화를 복구했습니다");
      };
    });

  list.querySelectorAll("[data-full-delete]")
    .forEach(button=>{
      button.onclick = ()=>{
        permanentlyDeleteConversation(
          button.dataset.fullDelete
        );
      };
    });
}

function emptyDeleted(){
  const ids =
    state.characters
      .filter(c=>c.deleted)
      .map(c=>c.id);

  if(!ids.length){
    showToast("최근 삭제된 항목이 없습니다");
    return;
  }

  openSheet(
    "최근 삭제된 항목 비우기",
    `
      <button
        class="sheet-button red"
        id="confirmEmptyDeleted"
      >
        모든 항목 영구 삭제
      </button>
    `,
    ()=>{
      document.getElementById("confirmEmptyDeleted")
        .onclick = ()=>{
          closeSheet();

          state.characters =
            state.characters.filter(
              c=>!c.deleted
            );

          state.messages =
            state.messages.filter(
              m=>!ids.includes(m.characterId)
            );

          saveState();

          renderFullDeletedScreen();
          renderConversationList();
          renderAdminCharacterList();

          showToast("최근 삭제된 항목을 비웠습니다");
        };
    }
  );
}


/* =========================================================
   SHEET
========================================================= */

function openSheet(title,content,onOpen){
  document.getElementById("sheetTitle")
    .textContent = title;

  document.getElementById("sheetContent")
    .innerHTML = content;

  const cover =
    document.getElementById("sheetCover");

  cover.classList.add("open");

  if(typeof onOpen==="function"){
    setTimeout(onOpen,20);
  }
}

function closeSheet(){
  document.getElementById("sheetCover")
    .classList.remove("open");
}


/* =========================================================
   FILE HANDLING
========================================================= */

function readImage(file,callback){
  if(!file) return;

  const reader = new FileReader();

  reader.onload = ()=>{
    callback(String(reader.result || ""));
  };

  reader.readAsDataURL(file);
}


/* =========================================================
   EVENTS
========================================================= */

function bindEvents(){

  /* list */

  bindListNavigationButtons();

  document.getElementById("composeFab")
    .onclick = openNewMessage;

  document.getElementById("profileRow")
    .onclick = openProfile;

  document.getElementById("filterCover")
    .onclick = closeFilterMenu;

  document.getElementById("filterPopover")
    .querySelectorAll("[data-filter]")
    .forEach(button=>{
      button.onclick = ()=>{
        const filter = button.dataset.filter;

        if(filter==="deleted"){
          closeFilterMenu();
          openDeletedScreen();
          return;
        }

        selectFilter(filter);
      };
    });

  document.getElementById("unreadFilterButton")
    .onclick = ()=>{
      unreadOnly = !unreadOnly;

      updateFilterMenu();
      closeFilterMenu();

      renderConversationList();
    };

  document.getElementById("filterManageButton")
    .onclick = ()=>{
      closeFilterMenu();

      renderFilterSettings();

      openScreen(screens.filterSettings);
    };

  /* edit */

  document.getElementById("selectAllButton")
    .onclick = selectAllVisible;

  document.getElementById("readSelectedButton")
    .onclick = ()=>markSelectedRead(true);

  document.getElementById("unreadSelectedButton")
    .onclick = ()=>markSelectedRead(false);

  document.getElementById("pinSelectedButton")
    .onclick = toggleSelectedPin;

  document.getElementById("deleteSelectedButton")
    .onclick = deleteSelected;

  /* chat */

  document.getElementById("backToListButton")
    .onclick = closeChat;

  document.getElementById("chatContact")
    .onclick = openContact;

  document.getElementById("chatInfoButton")
    .onclick = openContact;

  const userInput =
    document.getElementById("userMessageInput");

  userInput.addEventListener("input",updateUserInput);

  userInput.addEventListener("keydown",event=>{
    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){
      event.preventDefault();
      sendUserMessage();
    }
  });

  document.getElementById("userSendButton")
    .onclick = sendUserMessage;

  /* contact */

  document.getElementById("contactBackButton")
    .onclick = ()=>{
      closeScreen(screens.contact);
    };

  /* new message */

  document.getElementById("newMessageCancelButton")
    .onclick = ()=>{
      closeScreen(screens.newMessage);
    };

  document.getElementById("characterSearchInput")
    .addEventListener("input",event=>{
      renderCharacterPicker(event.target.value);
    });

  /* filter settings */

  document.getElementById("filterSettingsBackButton")
    .onclick = ()=>{
      closeScreen(screens.filterSettings);
    };

  document.getElementById("spamFilteringSwitch")
    .onclick = ()=>{
      state.settings.spamFiltering =
        !state.settings.spamFiltering;

      saveState();
      renderFilterSettings();
    };

  document.getElementById("unknownFilteringSwitch")
    .onclick = ()=>{
      state.settings.unknownFiltering =
        !state.settings.unknownFiltering;

      saveState();
      renderFilterSettings();
    };

  document.getElementById("smsFilteringSwitch")
    .onclick = ()=>{
      state.settings.smsFiltering =
        !state.settings.smsFiltering;

      saveState();
      renderFilterSettings();
    };

  document.getElementById("openAdminButton")
    .onclick = ()=>{
      renderAdminCharacterList();
      openScreen(screens.admin);
    };

  /* admin */

  document.getElementById("adminBackButton")
    .onclick = ()=>{
      closeScreen(screens.admin);
    };

  document.getElementById("addCharacterButton")
    .onclick = addCharacter;

  /* character detail */

  document.getElementById("characterDetailBackButton")
    .onclick = ()=>{
      closeScreen(screens.characterDetail);
    };

  document.getElementById("saveCharacterButton")
    .onclick = saveCharacter;

  document.getElementById("characterPhotoInput")
    .addEventListener("change",event=>{
      const file = event.target.files?.[0];

      readImage(file,result=>{
        pendingCharacterPhoto = result;

        const character =
          characterById(currentCharacterId);

        if(character){
          character.photo = result;
          saveState();
        }

        renderCharacterDetail();
      });

      event.target.value = "";
    });

  /* admin conversation */

  document.getElementById("adminConversationBackButton")
    .onclick = ()=>{
      closeScreen(screens.adminConversation);
    };

  document.getElementById("adminNowButton")
    .onclick = setAdminNow;

  document.getElementById("adminSendButton")
    .onclick = sendAdminMessage;

  document.getElementById("adminMessageInput")
    .addEventListener("keydown",event=>{
      if(
        event.key==="Enter" &&
        !event.shiftKey
      ){
        event.preventDefault();
        sendAdminMessage();
      }
    });

  /* profile */

  document.getElementById("profileBackButton")
    .onclick = ()=>{
      closeScreen(screens.profile);
    };

  document.getElementById("profileSaveButton")
    .onclick = saveProfile;

  document.getElementById("profilePhotoButton")
    .onclick = ()=>{
      document.getElementById("profilePhotoInput").click();
    };

  document.getElementById("profilePhotoInput")
    .addEventListener("change",event=>{
      const file = event.target.files?.[0];

      readImage(file,result=>{
        pendingProfilePhoto = result;

        applyAvatar(
          document.getElementById("profileEditAvatar"),
          {
            ...state.profile,
            photo:result
          }
        );
      });

      event.target.value = "";
    });

  /* deleted */

  document.getElementById("deletedBackButton")
    .onclick = ()=>{
      closeScreen(screens.deleted);
    };

  document.getElementById("emptyDeletedButton")
    .onclick = emptyDeleted;

  /* sheet */

  document.getElementById("sheetCancelButton")
    .onclick = closeSheet;

  document.getElementById("sheetCover")
    .addEventListener("click",event=>{
      if(event.target.id==="sheetCover"){
        closeSheet();
      }
    });
}


/* =========================================================
   INITIALIZATION
========================================================= */

function init(){
  loadState();

  renderProfile();
  renderConversationList();
  renderFilterSettings();
  renderAdminCharacterList();

  bindEvents();

  document.documentElement.style.background =
    getComputedStyle(document.documentElement)
      .getPropertyValue("--bg");
}

init();

})();
</script>
</body>
</html>
